:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #eef2f5;

  --accent: #c45c26; --accent-soft: #fde8dc;
  --success: #1f7a4c; --success-soft: #d8f3e5;
  --danger: #b42318; --danger-soft: #fde8e6;
  --warn: #b45309; --warn-soft: #fef3c7;
  --border: #d5dee5; --border-strong: #b8c5cf;

  --shadow: 0 8px 24px rgb(15 28 36 / 0.08);
  --shadow-sm: 0 1px 2px rgb(15 28 36 / 0.06);
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;line-height:1.45}
button{font:inherit;cursor:pointer} button:disabled{cursor:not-allowed;opacity:.55} input{font:inherit}
.shell{position:relative;min-height:100dvh;max-width:720px;margin:0 auto;padding:12px 16px 40px}
.blob{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:0}
.blob:before,.blob:after{content:"";position:absolute;border-radius:50%;filter:blur(60px)}
.blob:before{top:-6rem;right:-4rem;width:18rem;height:18rem;background:color-mix(in srgb,var(--primary) 12%,transparent)}
.blob:after{bottom:0;left:-5rem;width:20rem;height:20rem;background:color-mix(in srgb,var(--accent) 10%,transparent)}
#app{position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{min-width:0}
.brand .tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);margin:0}
.brand h1{margin:0;font-size:1.15rem;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:6px;flex-shrink:0}
.chip{display:flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-sm)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow);padding:20px}
.card h2{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.muted{color:var(--muted)}.subtle{color:var(--subtle)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--radius);border:none;font-weight:650;font-size:14px;transition:transform .12s,filter .12s,background .12s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-secondary{background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.btn-ghost{background:transparent;color:var(--fg)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-block{width:100%}.btn-lg{min-height:48px;font-size:16px;padding:12px 22px}
.icon-btn{width:44px;height:44px;min-height:44px;border-radius:var(--radius);border:none;background:transparent;display:grid;place-items:center;font-size:20px;color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.field{width:100%;height:48px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);padding:0 16px;font-size:16px;outline:none}
.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
label.small{display:block;margin-top:20px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.quote{margin:16px 0 0;border-left:4px solid var(--primary);background:color-mix(in srgb,var(--primary-soft) 55%,transparent);border-radius:var(--radius);padding:12px 16px;font-style:italic;font-size:14px}
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s ease}
.hud-card{overflow:hidden;padding:0}
.hud-head{background:var(--hud);color:var(--hud-fg);padding:20px}
.hud-head .label{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.72;margin:0}
.hud-head .level{margin:4px 0 0;font-size:1.6rem;font-weight:700}
.hud-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.hud-stats>div{background:var(--surface);text-align:center;padding:12px 8px}
.hud-stats strong{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.hud-stats span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section-title{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mode-list{display:grid;gap:12px}
.mode-btn{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px;border-radius:var(--radius-xl);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s,transform .12s}
.mode-btn:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border));box-shadow:var(--shadow)}
.mode-btn:active{transform:scale(.995)}
.mode-ico{width:48px;height:48px;flex-shrink:0;border-radius:var(--radius);background:var(--primary);color:#fff;display:grid;place-items:center;font-size:22px}
.mode-btn h3{margin:0;font-size:1rem;font-weight:700}
.mode-btn p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.35}
.pill{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
.pill-accent{background:var(--accent-soft);color:var(--accent)}
.pill-ok{background:var(--success-soft);color:var(--success)}
.pill-pri{background:var(--primary-soft);color:var(--primary)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-danger{background:var(--danger-soft);color:var(--danger)}
.mastery-row{margin-bottom:12px}
.mastery-row .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.badge-grid{grid-template-columns:repeat(3,1fr)}}
.badge{border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;background:var(--surface)}
.badge.on{border-color:color-mix(in srgb,var(--accent) 35%,var(--border));background:var(--accent-soft)}
.badge.off{opacity:.55}
.badge strong{display:block;font-size:13px}
.badge span{display:block;margin-top:2px;font-size:11px;color:var(--muted);line-height:1.3}
.mode-hud{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:520px){.mode-hud{grid-template-columns:repeat(4,1fr)}}
.hud-tile{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:10px 12px}
.hud-tile.warn{border-color:color-mix(in srgb,var(--danger) 40%,var(--border));background:var(--danger-soft)}
.hud-tile.hot{border-color:color-mix(in srgb,var(--accent) 35%,var(--border));background:var(--accent-soft)}
.hud-tile .l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud-tile .v{margin-top:2px;font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin:0 0 8px}
.q{margin:0;font-size:1.1rem;font-weight:650;letter-spacing:-.01em;line-height:1.35}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:52px;padding:14px 16px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface);font-weight:550;font-size:14px;transition:border-color .12s,background .12s,transform .1s}
.choice:hover:not(:disabled){border-color:color-mix(in srgb,var(--primary) 45%,var(--border));background:color-mix(in srgb,var(--primary-soft) 45%,var(--surface))}
.choice:active:not(:disabled){transform:scale(.99)}
.choice .letter{width:28px;height:28px;flex-shrink:0;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.choice.correct{border-color:var(--success);background:var(--success-soft)}
.choice.correct .letter{background:var(--success);color:#fff}
.choice.wrong{border-color:var(--danger);background:var(--danger-soft)}
.choice.wrong .letter{background:var(--danger);color:#fff}
.feedback{margin-top:14px;border-radius:var(--radius);border:1px solid;padding:12px 14px;font-size:14px}
.feedback.ok{border-color:color-mix(in srgb,var(--success) 30%,transparent);background:var(--success-soft)}
.feedback.bad{border-color:color-mix(in srgb,var(--danger) 30%,transparent);background:var(--danger-soft)}
.feedback strong{display:block;margin-bottom:4px}
.feedback.ok strong{color:var(--success)}
.feedback.bad strong{color:var(--danger)}
.fb-notes{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px;border-top:1px solid color-mix(in srgb,var(--fg) 10%,transparent);padding-top:10px}
.fb-notes li{position:relative;padding-left:20px;font-size:13px;line-height:1.45;color:var(--muted)}
.fb-notes li::before{position:absolute;left:0;top:0;font-weight:800}
.fb-notes li.yes::before{content:"\2713";color:var(--success)}
.fb-notes li.no::before{content:"\2715";color:var(--danger)}
.fb-notes b{color:var(--fg);font-weight:700}
.fb-actions{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px -14px -12px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid color-mix(in srgb,var(--fg) 10%,transparent);border-radius:0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px);background:var(--surface)}
.feedback.ok .fb-actions{background:var(--success-soft)}
.feedback.bad .fb-actions{background:var(--danger-soft)}
.fb-hint{font-size:12px;color:var(--muted)}
@media (max-height:520px){.fb-notes li{font-size:12px}.fb-actions{margin-top:10px}}
.center{text-align:center}
.footer-note{margin-top:28px;text-align:center;font-size:12px;color:var(--subtle)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tier-btn{min-height:56px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface-2);font-weight:700;font-size:13px;padding:12px}
.tier-btn.correct{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.tier-btn.wrong{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.need-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.need-pills .n{background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:650;color:var(--muted)}
.need-pills .name{background:var(--primary);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800}
.seq-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.seq-item{display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-lg);padding:12px;cursor:grab;user-select:none;touch-action:manipulation}
.seq-item.sel{border-color:var(--primary);background:var(--primary-soft)}
.seq-item.ok{border-color:var(--success);background:var(--success-soft)}
.seq-item.bad{border-color:color-mix(in srgb,var(--danger) 40%,var(--border));background:var(--danger-soft)}

.seq-item strong{display:block;font-size:14px}
.seq-item small{color:var(--muted);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px;text-align:left}
@media(min-width:520px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-box{border:1px solid var(--border);background:var(--surface-2);border-radius:var(--radius);padding:12px}
.stat-box .l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat-box .v{margin-top:4px;font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.logo{width:56px;height:56px;border-radius:var(--radius-lg);background:var(--primary);color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:14px}
</style>

<script>

      '</div><p class="footer-note">Built for new-hire retention · Play 5 minutes a day · Progress saves on this device<br/>Arch supports are not intended to treat medical ailments — never diagnose.</p>'

  function prepChoices() {
    var g = state.game;
    var q = g.questions[g.idx];
    if (!q) return;
    g.choices = C.shuffle(
      q.choices.map(function (text, originalIndex) {
        return { text: text, originalIndex: originalIndex };
      })
    );
  }

  function startClock() {
    clearTimer();
    state.timer = setInterval(function () {
      var g = state.game;
      if (!g || g.locked || g.type !== "lightning") return;
      g.timeLeft -= 1;
      if (g.timeLeft <= 0) {
        g.timeLeft = 0;
        onTimeout();
      } else {
        render();
      }
    }, 1000);
  }

  function startLightning() {
    state.mode = "lightning";
    state.game = {
      type: "lightning",
      questions: C.pickRamped(12),
      idx: 0,
      score: 0,
      streak: 0,
      bestStreak: 0,
      correct: 0,
      selected: null,
      locked: false,
      feedback: null,
      timeLeft: 14,
      xp: 0,
      choices: null,
    };
    clearAdvance();
    prepChoices();
    startClock();
    render();
  }

  function onTimeout() {
    var g = state.game;
    if (!g || g.locked) return;
    clearTimer();
    g.locked = true;
    g.streak = 0;
    var q = g.questions[g.idx];
    recordAnswer(q.category, false);
    g.feedback = { ok: false, text: "Time's up. " + q.explain };
    save();
    setAdvance(advanceLightning, g.idx + 1 >= g.questions.length ? "See results" : "Continue");
    render();
  }

  function answerLightning(orig) {
    var g = state.game;
    if (!g || g.locked) return;
    clearTimer();
    g.locked = true;
    g.selected = orig;
    var q = g.questions[g.idx];
    var ok = orig === q.correctIndex;
    recordAnswer(q.category, ok);
    var mult = Math.min(8, 1 + Math.floor(g.streak / 2));
    if (ok) {
      g.streak += 1;
      g.bestStreak = Math.max(g.bestStreak, g.streak);
      g.score += 100 * mult + g.timeLeft * 5;
      g.correct += 1;
      g.xp += 12 + mult * 3 + Math.floor(g.timeLeft / 2);
      noteStreak(g.streak);
      g.feedback = { ok: true, text: q.explain };
    } else {
      g.streak = 0;
      g.feedback = {
        ok: false,
        text: "Correct answer: " + q.choices[q.correctIndex] + ". " + q.explain,
      };
    }
    save();
    setAdvance(advanceLightning, g.idx + 1 >= g.questions.length ? "See results" : "Continue");
    render();
  }

  function advanceLightning() {
    var g = state.game;
    if (!g) return;
    if (g.idx + 1 >= g.questions.length) {
      addXp(g.xp);
      noteGame("lightning", g.score);
      noteStreak(g.bestStreak);
      finishRun({
        mode: "lightning",
        title: "Lightning Round complete",
        score: g.score,
        correct: g.correct,
        total: g.questions.length,
        bestStreak: g.bestStreak,
        xpEarned: g.xp,
      });
      return;
    }
    g.idx += 1;
    g.selected = null;
    g.locked = false;
    g.feedback = null;
    g.timeLeft = 14;
    prepChoices();
    startClock();
    render();
  }

  function prepFitChoices() {

      .map(function (c) {

      })
      .sort(function (a, b) {
        return (b.ok ? 1 : 0) - (a.ok ? 1 : 0);
      });

  function startSequence() {
    clearAdvance();
    state.mode = "sequence";
    state.game = {
      type: "sequence",
      order: C.shuffle(C.SALES_STEPS).map(function (s) {
        return { id: s.order, title: s.title, duration: s.duration, bullets: s.bullets || [] };

      dragIdx: null,
      checked: false,
      correctMap: [],
      score: 0,

  function moveSeq(from, to) {
    var g = state.game;
    if (!g || g.checked || from === to) return;
    var next = g.order.slice();
    var item = next.splice(from, 1)[0];
    next.splice(to, 0, item);
    g.order = next;
  }

  function checkSeq() {
    var g = state.game;
    if (!g || g.checked) return;
    var map = g.order.map(function (s, i) {
      return s.id === i + 1;
    });
    var correct = map.filter(Boolean).length;
    var perfect = correct === 8;
    g.correctMap = map;
    g.checked = true;
    var pts = correct * 100 + (perfect ? 400 : 0);
    g.score = pts;
    var i;
    for (i = 0; i < correct; i++) recordAnswer("sales", true);
    for (i = 0; i < 8 - correct; i++) recordAnswer("sales", false);
    var xp = correct * 10 + (perfect ? 50 : 0);
    var banked = state.seqXpAwarded || 0;
    var gain = Math.max(0, xp - banked);
    if (gain > 0) {
      state.seqXpAwarded = xp;
      addXp(gain);
      noteGame("sequence", pts);
    }
    xp = gain;
    if (perfect) {
      state.progress.sequencePerfects += 1;
      grantBadge("sequence_sorter");
      noteStreak(8);
      g.feedback = {
        ok: true,
        text: "Perfect! Greeting → Fitting → Discovery → Balance → Test Walks → Wearing → Close → POS.",
      };
      save();
      setAdvance(function () {
        finishRun({
          mode: "sequence",
          title: "Sales Sequence mastered",
          score: pts,
          correct: correct,
          total: 8,
          bestStreak: 8,
          xpEarned: xp,
        });
      }, "See results");
      render();
    } else {
      g.feedback = {
        ok: false,
        text: "You placed " + correct + "/8 correctly. Tap Reset to try again.",
      };
      save();
      render();
    }
  }

    var g = state.game;

        streak: g.correctMap.filter(Boolean).length,

      }) +

  function answerMastery(orig) {
    var g = state.game;
    if (!g || g.locked) return;
    g.locked = true;
    g.selected = orig;
    var q = g.queue[g.qi];
    var ok = orig === q.correctIndex;
    recordAnswer(q.category, ok);
    g.total += 1;
    if (ok) {
      g.streak += 1;
      g.bestStreak = Math.max(g.bestStreak, g.streak);
      var mult = Math.min(10, 1 + Math.floor(g.streak / 2));
      g.score += 100 * mult;
      g.correct += 1;
      g.xp += 10 + mult * 2;
      noteStreak(g.streak);
      g.feedback = { ok: true, text: q.explain };
    } else {
      g.lives -= 1;
      g.streak = 0;
      g.feedback = {
        ok: false,
        text: "Correct: " + q.choices[q.correctIndex] + ". " + q.explain,
      };
    }
    save();
    setAdvance(function () {
      if (!ok && g.lives <= 0) {
        addXp(g.xp);
        noteGame("mastery", g.score);
        noteStreak(g.bestStreak);
        finishRun({
          mode: "mastery",
          title: "Mastery Run over",
          score: g.score,
          correct: g.correct,
          total: g.total,
          bestStreak: g.bestStreak,
          xpEarned: g.xp,
        });
        return;
      }
      if (g.qi + 1 >= g.queue.length - 3) {
        g.queue = g.queue.concat(C.pickQuestions(20));
      }
      g.qi += 1;
      g.selected = null;
      g.locked = false;
      g.feedback = null;
      var nq = g.queue[g.qi];
      g.choices = C.shuffle(
        nq.choices.map(function (text, originalIndex) {
          return { text: text, originalIndex: originalIndex };
        })
      );
      render();
    }, !ok && g.lives <= 0 ? "See results" : "Continue");
    render();
  }

  function render() {
    var root = document.getElementById("app");
    var html = "";
    if (!state.progress.playerName && state.mode === "hub") html = renderWelcome();
    else if (state.mode === "hub") html = renderHub();
    else if (state.mode === "lightning") html = renderLightning();
    else if (state.mode === "sort") html = renderSort();
    else if (state.mode === "fitlab") html = renderFit();
    else if (state.mode === "sequence") html = renderSequence();
    else if (state.mode === "mastery") html = renderMastery();
    else if (state.mode === "results") html = renderResults();
    else html = renderHub();
    root.innerHTML = html;
    var af = root.querySelector("[data-autofocus]");
    if (af) {
      try {
        af.focus({ preventScroll: true });
      } catch (e) {}
      // Scroll the top of the explanation into view. The action row is
      // position:sticky, so Continue stays pinned to the bottom of the
      // viewport for as long as the explanation is taller than the screen.
      var fb = root.querySelector(".feedback");
      if (fb && window.scrollTo) {
        var r = fb.getBoundingClientRect();
        var vh = window.innerHeight || document.documentElement.clientHeight;
        if (r.top < 8 || r.top > vh - 96) {
          var y = (window.pageYOffset || document.documentElement.scrollTop || 0) + r.top - 12;
          try {
            window.scrollTo({ top: Math.max(0, y), behavior: "auto" });
          } catch (e) {
            window.scrollTo(0, Math.max(0, y));
          }
        }
      }
    }
  }

  document.getElementById("app").addEventListener("click", function (e) {
    var t = e.target.closest("[data-action],[data-mode],[data-choice],[data-tier],[data-fit],[data-seq-i]");
    if (!t) return;
    if (t.dataset.action === "start-name") {
      var name = ((document.getElementById("name") && document.getElementById("name").value) || "")
        .trim()
        .slice(0, 24);
      if (name.length < 2) return;
      state.progress.playerName = name;
      save();
      render();
      return;
    }
    if (t.dataset.action === "continue") {
      doAdvance();
      return;
    }
    if (t.dataset.action === "hub") {
      setMode("hub");
      return;
    }
    if (t.dataset.action === "replay") {
      var m = state.lastResult && state.lastResult.mode;
      if (m === "lightning") startLightning();
      else if (m === "sort") startSort();
      else if (m === "fitlab") startFit();
      else if (m === "sequence") startSequence();
      else if (m === "mastery") startMastery();
      else setMode("hub");
      return;
    }
    if (t.dataset.action === "check-seq") {
      checkSeq();
      return;
    }
    if (t.dataset.action === "reset-seq") {
      startSequence();
      return;
    }
    if (t.dataset.action === "cash-out") {
      cashOutMastery();
      return;
    }
    if (t.dataset.mode) {
      var id = t.dataset.mode;
      if (id === "lightning") startLightning();
      else if (id === "sort") startSort();
      else if (id === "fitlab") startFit();
      else if (id === "sequence") { state.seqXpAwarded = 0; startSequence(); }
      else if (id === "mastery") startMastery();
      return;
    }
    if (t.dataset.choice != null) {
      var n = Number(t.dataset.choice);
      if (state.game && state.game.type === "lightning") answerLightning(n);
      else if (state.game && state.game.type === "mastery") answerMastery(n);
      return;
    }
    if (t.dataset.tier) {
      answerSort(t.dataset.tier);
      return;
    }
    if (t.dataset.fit) {
      answerFit(t.dataset.fit);
      return;
    }
    if (t.dataset.seqI != null && state.game && state.game.type === "sequence" && !state.game.checked) {
      var si = Number(t.dataset.seqI);
      var g = state.game;
      if (g.dragIdx == null) {
        g.dragIdx = si;
        render();
      } else {
        moveSeq(g.dragIdx, si);
        g.dragIdx = null;
        render();
      }
    }
  });

  document.getElementById("app").addEventListener("dragstart", function (e) {
    var li = e.target.closest("[data-seq-i]");
    if (!li || !state.game || state.game.checked) return;
    state.game.dragIdx = Number(li.dataset.seqI);
  });
  document.getElementById("app").addEventListener("dragover", function (e) {
    var li = e.target.closest("[data-seq-i]");
    if (!li || !state.game || state.game.checked) return;
    e.preventDefault();
    var i = Number(li.dataset.seqI);
    if (state.game.dragIdx == null || state.game.dragIdx === i) return;
    moveSeq(state.game.dragIdx, i);
    state.game.dragIdx = i;
    render();
  });
  document.getElementById("app").addEventListener("dragend", function () {
    if (state.game) state.game.dragIdx = null;
  });
  document.addEventListener("keydown", function (e) {
    if (!state.advance) return;
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar" || e.key === "ArrowRight") {
      e.preventDefault();
      doAdvance();
    }
  });

  document.getElementById("app").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "name") {
      e.preventDefault();
      var btn = document.querySelector('[data-action="start-name"]');
      if (btn) btn.click();
    }
  });

  render();
})();
</script>
</body>
</html>
