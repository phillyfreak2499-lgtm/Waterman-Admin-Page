<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3-Step Showdown · Archie Sole</title>
<style>
  :root {
    --bg: #07090e;
    --elevated: #10151e;
    --subtle: #171e2a;
    --fg: #f0f4f8;
    --muted: #9aa8b8;
    --subtle-fg: #667689;
    --border: rgba(240,244,248,0.1);
    --border-strong: rgba(240,244,248,0.18);
    --accent: #2dd4bf;
    --accent-fg: #04201c;
    --host: #f0a060;
    --host-fg: #1a0c06;
    --success: #34d399;
    --danger: #f87171;
    --warn: #fbbf24;
    --p1: #38bdf8;
    --p2: #4ade80;
    --p3: #fb923c;
    --p4: #c084fc;
    --radius: 16px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --display: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; border-color: var(--border); }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  button:not(:disabled) { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }
  h1,h2,h3 { font-family: var(--display); letter-spacing: -0.02em; margin: 0; }
  .wrap {
    max-width: 960px; margin: 0 auto; padding: 16px 14px 40px;
    position: relative; z-index: 1;
  }
  .stage {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -5%, rgba(240,160,96,0.22), transparent 55%),
      radial-gradient(ellipse 40% 40% at 12% 88%, rgba(45,212,191,0.12), transparent 55%),
      radial-gradient(ellipse 40% 40% at 88% 85%, rgba(56,189,248,0.1), transparent 55%),
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  .panel {
    position: relative;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.12);
    background: linear-gradient(165deg, rgba(255,255,255,0.07), rgba(16,21,30,0.95) 40%, var(--elevated));
    box-shadow: 0 1px 0 rgba(255,255,255,0.08), 0 20px 50px -20px rgba(0,0,0,0.75);
    padding: 16px 18px;
  }
  .panel::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 42%);
    opacity: 0.5;
  }
  .panel > * { position: relative; z-index: 1; }
  .glass {
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(16,21,30,0.78);
    box-shadow: 0 12px 32px -16px rgba(0,0,0,0.6);
    padding: 12px 14px;
  }
  .chip {
    display: inline-flex; align-items: center;
    border-radius: 999px; border: 1px solid rgba(255,255,255,0.1);
    padding: 3px 10px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .btn {
    display: inline-flex; align-items: center; justify-center; justify-content: center; gap: 8px;
    border: none; border-radius: 12px; font-weight: 600; font-size: 14px;
    padding: 12px 18px; transition: filter 0.15s, transform 0.1s;
  }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(180deg, var(--host), #c46a35);
    color: var(--host-fg);
    box-shadow: 0 8px 24px -10px rgba(240,160,96,0.5);
  }
  .btn-accent {
    background: linear-gradient(180deg, var(--accent), #0f766e);
    color: var(--accent-fg);
  }
  .btn-secondary {
    background: var(--subtle); color: var(--fg);
    border: 1px solid var(--border-strong);
  }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1px solid transparent;
  }
  .btn-ghost:hover { background: var(--subtle); color: var(--fg); }
  .btn-lg { padding: 14px 20px; font-size: 15px; width: 100%; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .grid-2 { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }
  input {
    width: 100%; height: 42px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: rgba(7,9,14,0.8);
    color: var(--fg); padding: 0 12px; font-size: 14px; outline: none;
  }
  input:focus { border-color: rgba(240,160,96,0.5); box-shadow: 0 0 0 2px rgba(240,160,96,0.2); }
  .muted { color: var(--muted); font-size: 13px; }
  .subtle { color: var(--subtle-fg); font-size: 11px; }
  .title { font-size: 22px; font-weight: 700; }
  .host-card { display: flex; gap: 12px; align-items: flex-start; }
  .host-avatar {
    width: 72px; height: 72px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(145deg, #3a2a20, #1a1210);
    border: 2px solid rgba(240,160,96,0.45);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; box-shadow: 0 0 24px rgba(240,160,96,0.25);
    overflow: hidden; padding: 0;
  }
  .host-avatar img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 18%;
    display: block;
  }
  .host-avatar.sm { width: 56px; height: 56px; border-radius: 12px; }
  .host-bubble {
    flex: 1; background: rgba(7,9,14,0.7); border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 500;
    position: relative;
  }
  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .seg button {
    padding: 12px; border-radius: 12px; border: 1px solid var(--border-strong);
    background: rgba(16,21,30,0.8); color: var(--muted); font-weight: 600; font-size: 14px;
  }
  .seg button.active-train {
    background: linear-gradient(180deg, var(--accent), #0f766e); color: var(--accent-fg); border-color: transparent;
  }
  .seg button.active-show {
    background: linear-gradient(180deg, var(--host), #c46a35); color: var(--host-fg); border-color: transparent;
  }
  .count-btn {
    min-width: 40px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: rgba(7,9,14,0.7);
    color: var(--muted); font-weight: 600;
  }
  .count-btn.on { background: var(--host); color: var(--host-fg); border-color: transparent; }
  .count-btn.on-accent { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .prompt {
    font-size: 22px; font-weight: 700; line-height: 1.3; min-height: 3.2em;
  }
  .cursor {
    display: inline-block; width: 2px; height: 1em; background: var(--host);
    margin-left: 2px; vertical-align: middle; animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .choice {
    text-align: left; width: 100%;
    min-height: 52px; border-radius: 12px;
    border: 1px solid var(--border-strong);
    background: linear-gradient(180deg, var(--subtle), var(--bg));
    color: var(--fg); padding: 12px 14px; font-size: 14px;
    transition: border-color 0.15s, background 0.15s;
  }
  .choice:hover:not(:disabled) { border-color: rgba(240,160,96,0.5); background: rgba(240,160,96,0.12); }
  .choice.correct { border-color: rgba(52,211,153,0.5); background: rgba(52,211,153,0.12); }
  .choice.wrong { opacity: 0.5; }
  .timer-track {
    height: 14px; border-radius: 999px; border: 1px solid var(--border-strong);
    background: rgba(0,0,0,0.45); padding: 2px; overflow: hidden;
  }
  .timer-fill {
    height: 100%; border-radius: 999px; transition: width 0.1s linear;
    box-shadow: 0 0 12px currentColor;
  }
  .booths {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  }
  .review { display: grid; gap: 8px; }
  .review-item {
    border-radius: 12px; border: 1px solid var(--border);
    border-left: 3px solid var(--success);
    background: rgba(7,9,14,0.55); padding: 10px 12px;
  }
  .review-item.miss { border-left-color: var(--danger); background: rgba(248,113,113,0.07); }
  .review-q { font-weight: 600; font-size: 14px; margin-top: 2px; line-height: 1.35; }
  .review-mark { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  /* Phone landscape: the booth row used to start ~495px down a 390px-tall
     viewport, so contestants could not see their own buzzer during the buzz
     window. Pin it to the bottom of the screen and trim the vertical bulk. */
  @media (max-height: 560px) {
    .wrap { padding: 10px 12px 24px; }
    /* Only the Showdown play screen has a pinned booth row to clear. */
    .wrap:has(.booth-panel) { padding-bottom: 168px; }
    @supports not selector(:has(*)) { .wrap { padding-bottom: 168px; } }
    .panel { padding: 12px 14px; }
    .host-avatar { width: 48px; height: 48px; border-radius: 12px; }
    .host-bubble { font-size: 13px; padding: 8px 10px; }
    .prompt { font-size: 18px; min-height: 2.2em; }
    .stack { gap: 9px; }
    .booth-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      max-width: 960px; margin: 0 auto; padding: 8px 12px 10px;
      border-radius: 18px 18px 0 0;
      background: #080b11;
      border-top: 1px solid var(--border-strong);
      box-shadow: 0 -14px 34px -14px rgba(0,0,0,0.9);
    }
    .booth-panel .booths { gap: 8px; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
    .booth { padding: 7px 6px; }
    .buzz-btn { height: 36px; margin-top: 6px; font-size: 10px; letter-spacing: 0.08em; }
  }
  .booth {
    border-radius: 16px; border: 1px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(23,30,42,0.95), rgba(7,9,14,0.9));
    padding: 12px; text-align: center;
  }
  .booth.active { ring: 2px; box-shadow: 0 0 20px rgba(56,189,248,0.35); border-color: transparent; outline: 2px solid var(--p1); }
  .booth.out { opacity: 0.4; filter: grayscale(0.6); }
  .buzz-btn {
    width: 100%; margin-top: 8px; height: 44px; border-radius: 999px; border: none;
    font-weight: 700; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #0a0e14;
  }
  .buzz-btn.live { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.15); }
  }
  .score-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .score-item {
    display: flex; align-items: center; gap: 12px;
    border-radius: 14px; border: 1px solid var(--border);
    background: rgba(16,21,30,0.8); padding: 12px 14px;
  }
  .score-item.lead { outline: 1px solid rgba(240,160,96,0.4); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.72); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .hidden { display: none !important; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .space-y > * + * { margin-top: 10px; }
  .center { text-align: center; }
  .tabular { font-variant-numeric: tabular-nums; }
</style>
<script src="/games/quad-bridge.js"></script></head>

const COLORS = ["#38bdf8","#4ade80","#fb923c","#c084fc"];

let state = {
  screen: "setup", // setup | play | round | final
  mode: "showdown", // training | showdown
  playerCount: 2,
  names: ["Player 1","Player 2","Player 3","Player 4"],
  rounds: 3, // 2/3/4 -> 10/15/20 qs
  players: [],
  questions: [],
  qi: 0,
  phase: "intro", // intro | buzz | answer | reveal
  active: null,
  eliminated: [],
  lastCorrect: null,
  steal: false,
  wordCount: 0,
  timerLeft: BUZZ_SEC,
  timerTotal: BUZZ_SEC,
  paused: false,
  completedRound: 0,
  baseline: [],
  answers: [],   // per-question record: {picked, correct, by} -- drives the review
  readingTimer: null,
  clockTimer: null,
  cueFired: new Set(),
};

// --- Audio (simple beeps) ---
let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur=0.1, type="square", gain=0.08, delay=0) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const sfx = {
  start() { tone(330,0.1,"triangle",0.1); tone(440,0.1,"triangle",0.1,0.1); tone(554,0.18,"triangle",0.12,0.2); },
  open() { tone(440,0.08,"triangle"); tone(554,0.1,"triangle",0.1,0.07); tone(659,0.14,"triangle",0.12,0.14); },
  buzz(i=0) { tone(520+i*40,0.12,"sawtooth",0.12); },
  correct() { tone(523,0.1,"triangle"); tone(659,0.1,"triangle",0.1,0.09); tone(784,0.18,"triangle",0.12,0.18); },
  wrong() { tone(220,0.28,"sawtooth",0.1); },
  ten() { tone(988,0.1,"sine",0.12); tone(1319,0.16,"triangle",0.1,0.09); },
  five() { tone(880,0.08,"square",0.12); tone(1175,0.1,"square",0.12,0.1); },
  count(n) { const f=520+(5-n)*200; tone(f,0.09,"square",0.1); if(n===1) tone(f*1.25,0.16,"square",0.12,0.1); },
  timeout() { tone(180,0.35,"triangle",0.1); },
  tick() { tone(880,0.04,"square",0.04); },
  select() { tone(700,0.05,"sine",0.06); },
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// Weighted draw: seed one question from every core category first, then fill the
// rest at random. Guarantees a run always covers the selling systems and the
// 3-Step System instead of leaving it to chance.
function pickQuestions(n) {
  const want = Math.min(n, BANK.length);
  const picked = [];
  const used = new Set();
  shuffle(CORE_CATS).forEach(cat => {
    if (picked.length >= want) return;
    const pool = BANK.filter((q,i) => q.cat === cat && !used.has(i));
    if (!pool.length) return;
    const q = shuffle(pool)[0];
    const idx = BANK.indexOf(q);
    used.add(idx); picked.push(q);
  });
  const rest = shuffle(BANK.filter((q,i) => !used.has(i)));
  for (let i = 0; picked.length < want && i < rest.length; i++) picked.push(rest[i]);
  return shuffle(picked).map((q,i)=>({...q, id:i}));
}

// Log what happened on the current question so the final screen can show a
// review and the results file can mark the misses.
function recordAnswer(picked, correct, byId) {
  const p = byId == null ? null : state.players[byId];
  state.answers[state.qi] = { picked: picked, correct: !!correct, by: p ? p.name : null };
}

function clearTimers() {
  if (state.readingTimer) { clearTimeout(state.readingTimer); state.readingTimer=null; }
  if (state.clockTimer) { clearInterval(state.clockTimer); state.clockTimer=null; }
}

function startGame() {
  unlockAudio(); sfx.start();
  clearTimers();
  const training = state.mode === "training";
  const count = training ? 1 : state.playerCount;
  const qCount = training ? TRAINING_Q : state.rounds * Q_PER_ROUND;
  state.players = Array.from({length:count}, (_,i)=>({
    id:i,
    name: (state.names[i]||"").trim() || (training ? "Trainee" : `Player ${i+1}`),
    score:0, correct:0, wrong:0, buzzes:0
  }));
  state.questions = pickQuestions(qCount);
  state.answers = [];
  state.qi = 0;
  state.baseline = state.players.map(p=>({score:p.score,correct:p.correct,wrong:p.wrong}));
  state.screen = "play";
  beginIntro();
}

function beginIntro() {
  clearTimers();
  state.phase = "intro";
  state.active = null;
  state.eliminated = [];
  state.lastCorrect = null;
  state.steal = false;
  state.wordCount = 0;
  state.cueFired = new Set();
  state.paused = false;
  render();
  const words = state.questions[state.qi].q.trim().split(/\s+/);
  let i = 0;
  const tick = () => {
    if (state.paused) { state.readingTimer = setTimeout(tick, 120); return; }
    if (state.phase !== "intro") return;
    if (i < words.length) {
      i++; state.wordCount = i;
      if (i % 4 === 0) sfx.tick();
      renderPromptOnly();
      state.readingTimer = setTimeout(tick, WORD_MS);
    } else {
      state.readingTimer = setTimeout(() => {
        if (state.paused) { state.readingTimer = setTimeout(tick, 120); return; }
        openBuzzOrAnswer();
      }, 450);
    }
  };
  state.readingTimer = setTimeout(tick, 320);
}

function openBuzzOrAnswer() {
  if (state.mode === "training" || state.players.length === 1) {
    state.phase = "answer";
    state.active = 0;
    state.players[0].buzzes++;
    state.timerTotal = ANSWER_SEC;
    state.timerLeft = ANSWER_SEC;
    sfx.buzz(0);
    startClock();
  } else {
    state.phase = "buzz";
    state.active = null;
    state.timerTotal = BUZZ_SEC;
    state.timerLeft = BUZZ_SEC;
    sfx.open();
    startClock();
  }
  render();
}

function startClock() {
  if (state.clockTimer) clearInterval(state.clockTimer);
  state.cueFired = new Set();
  // Count down by elapsed delta rather than from a fixed start time. The old
  // version derived `left` from wall-clock, so pausing froze the display while
  // the clock kept draining -- pause 12s in a 15s window and you resumed
  // already timed out, despite the overlay promising the timer was frozen.
  let last = Date.now();
  state.timerLeft = state.timerTotal;
  state.clockTimer = setInterval(() => {
    const now = Date.now();
    const dt = (now - last) / 1000;
    last = now;
    if (state.paused) return;
    const left = Math.max(0, state.timerLeft - dt);
    state.timerLeft = left;
    const sec = Math.ceil(left);
    if (left>0 && sec===10 && !state.cueFired.has(10)) { state.cueFired.add(10); sfx.ten(); }
    if (left>0 && sec===5 && !state.cueFired.has(5)) { state.cueFired.add(5); sfx.five(); }
    if (left>0 && [4,3,2,1].includes(sec) && !state.cueFired.has(sec)) { state.cueFired.add(sec); sfx.count(sec); }
    updateTimerUI();
    if (left <= 0) {
      clearInterval(state.clockTimer); state.clockTimer=null;
      sfx.timeout();
      if (state.phase === "buzz") onBuzzTimeout();
      else if (state.phase === "answer") onAnswerTimeout();
    }
  }, 50);
}

function onBuzzTimeout() {
  state.phase = "reveal";
  state.lastCorrect = false;
  state.steal = false;
  recordAnswer(null, false, null);
  render();
}
function onAnswerTimeout() {
  const id = state.active;
  if (id == null) return;
  const p = state.players[id];
  p.score = Math.max(0, p.score - 50);
  p.wrong++;
  if (state.mode === "training" || state.players.length <= 1) {
    state.phase = "reveal";
    state.lastCorrect = false;
    recordAnswer(null, false, id);
    render();
    return;
  }
  state.eliminated = [...new Set([...state.eliminated, id])];
  const remaining = state.players.filter(x => !state.eliminated.includes(x.id));
  if (remaining.length === 0) {
    state.phase = "reveal";
    state.lastCorrect = false;
    state.steal = false;
    recordAnswer(null, false, id);
  } else {
    state.phase = "buzz";
    state.active = null;
    state.steal = true;
    state.timerTotal = BUZZ_SEC;
    state.timerLeft = BUZZ_SEC;
    sfx.wrong();
    startClock();
  }
  render();
}

function buzz(id) {
  if (state.paused || state.phase !== "buzz") return;
  if (state.active != null) return;
  if (state.eliminated.includes(id)) return;
  unlockAudio();
  state.active = id;
  state.players[id].buzzes++;
  state.phase = "answer";
  state.timerTotal = ANSWER_SEC;
  state.timerLeft = ANSWER_SEC;
  sfx.buzz(id);
  startClock();
  render();
}

function pickAnswer(idx) {
  if (state.paused || state.phase !== "answer" || state.active == null) return;
  unlockAudio(); sfx.select();
  clearTimers();
  const q = state.questions[state.qi];
  const correct = idx === q.a;
  const p = state.players[state.active];
  if (correct) {
    p.score += 100; p.correct++;
    state.lastCorrect = true;
    state.phase = "reveal";
    recordAnswer(idx, true, state.active);
    sfx.correct();
  } else {
    p.score = Math.max(0, p.score - 50); p.wrong++;
    if (state.mode === "training" || state.players.length <= 1) {
      state.lastCorrect = false;
      state.phase = "reveal";
      recordAnswer(idx, false, state.active);
      sfx.wrong();
    } else {
      state.eliminated = [...new Set([...state.eliminated, state.active])];
      const remaining = state.players.filter(x => !state.eliminated.includes(x.id));
      sfx.wrong();
      if (remaining.length === 0) {
        state.lastCorrect = false;
        state.phase = "reveal";
        state.steal = false;
        recordAnswer(idx, false, state.active);
      } else {
        recordAnswer(idx, false, state.active);
        state.phase = "buzz";
        state.active = null;
        state.steal = true;
        state.timerTotal = BUZZ_SEC;
        state.timerLeft = BUZZ_SEC;
        startClock();
      }
    }
  }
  render();
}

function continueAfterReveal() {
  if (state.paused) return;
  const next = state.qi + 1;
  if (next >= state.questions.length) {
    state.screen = "final";
    try {
      if (window.QuadScore && state.players.length) {
        window.QuadScore.report(Math.max.apply(null, state.players.map(function (p) { return p.score || 0; })));
      }
    } catch (e) {}
    clearTimers();
    sfx.start();
    render();
    return;
  }
  if (state.mode !== "training" && next % Q_PER_ROUND === 0) {
    state.qi = next;
    state.completedRound = next / Q_PER_ROUND;
    state.screen = "round";
    clearTimers();
    render();
    return;
  }
  state.qi = next;
  beginIntro();
}

function continueAfterRound() {
  state.baseline = state.players.map(p=>({score:p.score,correct:p.correct,wrong:p.wrong}));
  state.screen = "play";
  beginIntro();
}

function togglePause() {
  if (state.screen !== "play" && state.screen !== "round") return;
  state.paused = !state.paused;
  render();
}

// --- Download helpers ---
function downloadText(filename, text) {
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function downloadStudyGuide() {
  let t = "3-STEP SHOWDOWN — STUDY GUIDE\nWaterman / Good Feet product knowledge\n\n";
  BANK.forEach((q,i)=>{
    t += `${i+1}. [${q.cat}] ${q.q}\n`;
    q.choices.forEach((c,j)=> t += `   ${String.fromCharCode(65+j)}. ${c}${j===q.a?"  ← CORRECT":""}\n`);
    t += `   Why: ${q.why}\n\n`;
  });
  downloadText("3-step-study-guide.txt", t);
}
function downloadResults() {
  const ranked = [...state.players].sort((a,b)=>b.score-a.score || b.correct-a.correct);
  let t = `3-STEP SHOWDOWN RESULTS\n${new Date().toLocaleString()}\nMode: ${state.mode}\n\nSTANDINGS\n`;
  ranked.forEach((p,i)=> t += `${i+1}. ${p.name} — ${p.score} pts · ${p.correct} correct · ${p.wrong} wrong\n`);
  const missedCount = state.questions.filter((q,i)=>!(state.answers[i]&&state.answers[i].correct)).length;
  t += `\nQUESTIONS (${state.questions.length - missedCount} correct · ${missedCount} missed)\n`;
  state.questions.forEach((q,i)=>{
    const rec = state.answers[i] || {};
    const ok = !!rec.correct;
    const picked = (rec.picked==null) ? "no answer — time ran out" : q.choices[rec.picked];
    t += `${i+1}. ${ok?"[CORRECT]":"[MISSED] "} [${q.cat}] ${q.q}\n`;
    if (!ok) t += `   Answered: ${picked}${rec.by?` (${rec.by})`:""}\n`;
    t += `   Answer: ${q.choices[q.a]}\n   ${q.why}\n\n`;
  });
  if (missedCount) {
    t += "REVIEW THESE\n";
    state.questions.forEach((q,i)=>{
      if (!(state.answers[i]&&state.answers[i].correct)) t += `- [${q.cat}] ${q.q}\n`;
    });
    t += "\n";
  }
  downloadText("showdown-results.txt", t);
}

// --- Render ---
function el(html) {
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstChild;
}

function render() {
  const root = document.getElementById("app");
  if (state.screen === "setup") root.innerHTML = renderSetup();
  else if (state.screen === "play") root.innerHTML = renderPlay();
  else if (state.screen === "round") root.innerHTML = renderRound();
  else if (state.screen === "final") root.innerHTML = renderFinal();
  bind();
  if (state.screen === "play") fitBuzzers();
}

      ${training ? `
        <div class="muted" style="font-weight:600">Trainee name</div>
        <input id="name0" maxlength="18" value="${escapeAttr(state.names[0]==="Player 1"?"Trainee":state.names[0])}" placeholder="Trainee" />
        <div class="subtle">1 player · ${TRAINING_Q} questions · 3-Step, CARE, W.R.A.P., Complete Solution &amp; red flags · +100 / −50 · ${ANSWER_SEC}s to answer</div>
      ` : `
        <div class="row" style="justify-content:space-between">
          <div class="muted" style="font-weight:600">Players</div>
          <div class="row">${[2,3,4].map(n=>`<button type="button" class="count-btn ${state.playerCount===n?"on":""}" data-count="${n}">${n}</button>`).join("")}</div>
        </div>
        <div class="grid-2">
          ${Array.from({length:state.playerCount},(_,i)=>`
            <label class="stack" style="gap:4px">
              <span class="subtle">Player ${i+1}</span>
              <input data-name="${i}" maxlength="18" value="${escapeAttr(state.names[i])}" />
            </label>`).join("")}
        </div>
        <div class="row" style="justify-content:space-between;margin-top:8px">
          <div class="muted" style="font-weight:600">Match length</div>
          <div class="row">${[2,3,4].map(r=>`<button type="button" class="count-btn ${state.rounds===r?"on-accent":""}" data-rounds="${r}">${r} rounds</button>`).join("")}</div>
        </div>
        <div class="subtle">5 questions per round · scoreboard between · keys 1–4 to buzz/answer</div>
      `}
    </div>
    <button type="button" class="btn ${training?"btn-accent":"btn-primary"} btn-lg" id="startBtn">${training?"Start training round":"Start showdown with Archie Sole"}</button>
    <button type="button" class="btn btn-secondary btn-lg" id="guideBtn">Download study guide</button>
    <div class="center subtle">Full question bank with answers · works offline in any browser</div>
  </div>`;
}

function renderPlay() {
  const q = state.questions[state.qi];
  const training = state.mode === "training";
  const words = q.q.trim().split(/\s+/);
  const visible = words.slice(0, state.wordCount).join(" ");
  const speaking = state.phase === "intro" && state.wordCount < words.length && !state.paused;
  const round = Math.floor(state.qi / Q_PER_ROUND) + 1;
  const totalRounds = Math.ceil(state.questions.length / Q_PER_ROUND);
  const qInRound = (state.qi % Q_PER_ROUND) + 1;
  const activeP = state.players.find(p=>p.id===state.active);
  const hostLine = state.paused ? "We'll hold right here — resume when you're ready."
    : state.phase==="intro" ? (speaking ? "Listen carefully…" : (training?"Your turn!":"Buzzers coming up!"))
    : state.phase==="reveal" ? (state.lastCorrect ? `That's right — ${(activeP&&activeP.name)||"that booth"} nailed it!` : `Correct answer: ${q.choices[q.a]}.`)
    : state.phase==="buzz" && state.steal ? "Wrong answer! Remaining booths — steal it!"
    : state.phase==="answer" && activeP ? `${activeP.name}, pick an answer — tap to lock it in.`
    : state.phase==="buzz" ? "Buzz in if you know it!" : "On the set!";

  const pct = Math.max(0, Math.min(1, state.timerLeft / state.timerTotal)) * 100;
  const urgent = state.timerLeft <= 4;
  const fillColor = urgent ? "var(--danger)" : state.timerLeft <= 10 ? "var(--warn)" : state.phase==="buzz" ? "var(--accent)" : "var(--p1)";

  return `
  <div class="stack">
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="subtle" style="color:var(--host);font-weight:700;letter-spacing:0.12em;text-transform:uppercase">${training?"Solo training":"Live with Archie Sole"}</div>
          <h1 class="title" style="font-size:18px">${training?"Training Round":"3-Step Showdown"}</h1>
          <div class="muted">${training?`Question ${state.qi+1} of ${state.questions.length}`:`Round ${round}/${totalRounds} · Q ${qInRound}/5`}</div>
        </div>
        <div class="row">
          <button type="button" class="btn btn-ghost" id="pauseBtn" title="Pause (Esc/P)">⏸ Pause</button>
          <button type="button" class="btn btn-ghost" id="endBtn">End</button>
        </div>
      </div>
    </div>
    <div class="glass host-card">
      <div class="host-avatar"><img src="${ARCHIE_SRC}" alt="Host Archie Sole" /></div>
      <div class="grow">
        <span class="chip" style="background:rgba(240,160,96,0.2);color:var(--host)">Host</span>
        <div class="host-bubble" style="margin-top:6px">${escapeHtml(hostLine)}</div>
      </div>
    </div>
    <div class="panel space-y">
      <div class="row">
        <span class="chip" style="background:rgba(45,212,191,0.15);color:var(--accent)">${escapeHtml(q.cat)}</span>
        <span class="chip" style="background:rgba(240,160,96,0.15);color:var(--host)">100 pts</span>
        ${state.paused?`<span class="chip" style="background:rgba(251,191,36,0.15);color:var(--warn)">Paused</span>`:""}
        ${state.steal&&state.phase==="buzz"?`<span class="chip" style="background:rgba(251,191,36,0.15);color:var(--warn)">Steal!</span>`:""}
      </div>
      <div class="prompt" id="promptText">${escapeHtml(visible)}${speaking?'<span class="cursor"></span>':""}${!visible&&state.phase==="intro"?'<span class="muted">…</span>':""}</div>
      ${(state.phase==="buzz"||state.phase==="answer")?`
        <div>
          <div class="row" style="justify-content:space-between;margin-bottom:6px">
            <span class="subtle">${state.paused?"Paused":state.phase==="buzz"?"Buzz window":"Answer clock"}</span>
            <span class="tabular" id="timerSec" style="font-weight:700;color:${urgent?"var(--danger)":"var(--fg)"}">${Math.ceil(state.timerLeft)}s</span>
          </div>
          <div class="timer-track"><div class="timer-fill" id="timerFill" style="width:${pct}%;background:${fillColor};color:${fillColor}"></div></div>
        </div>`:""}
      ${state.phase==="intro"?`<p class="muted">${training?"Archie is reading. Answers open when he finishes.":"Archie is reading. Buzzers open when he finishes — keys 1–"+state.players.length+"."}</p>`:""}
      ${state.phase==="buzz"?`<p class="muted" style="color:var(--host);font-weight:600">${state.steal?"Remaining booths — steal it!":"Buzzers are live. Hit your desk button!"}</p>`:""}
      ${state.phase==="answer"&&activeP?`
        <p class="muted"><strong style="color:var(--fg)">${escapeHtml(activeP.name)}</strong> — choose the best answer.</p>
        <div class="grid-2">
          ${q.choices.map((c,i)=>`<button type="button" class="choice" data-pick="${i}" ${state.paused?"disabled":""}><strong>${String.fromCharCode(65+i)}.</strong> ${escapeHtml(c)}</button>`).join("")}
        </div>
        <div class="subtle">Keys 1–4 submit instantly</div>`:""}
      ${state.phase==="reveal"?`
        <div class="glass" style="border-color:${state.lastCorrect?"rgba(52,211,153,0.35)":"rgba(248,113,113,0.35)"};background:${state.lastCorrect?"rgba(52,211,153,0.1)":"rgba(248,113,113,0.1)"}">
          <strong>${state.lastCorrect?`${escapeHtml((activeP&&activeP.name)||"Player")} is correct!`:"Not quite — correct answer revealed"}</strong>
          <div class="muted" style="margin-top:6px">Answer: <strong style="color:var(--fg)">${escapeHtml(q.choices[q.a])}</strong></div>
          <div class="muted" style="margin-top:8px">${escapeHtml(q.why)}</div>
        </div>
        <div class="grid-2">
          ${q.choices.map((c,i)=>`<div class="choice ${i===q.a?"correct":"wrong"}"><strong>${String.fromCharCode(65+i)}.</strong> ${escapeHtml(c)}</div>`).join("")}
        </div>
        <button type="button" class="btn btn-primary btn-lg" id="nextBtn" ${state.paused?"disabled":""}>${
          state.qi+1>=state.questions.length ? (training?"See training results":"See final scores")
          : (state.qi+1)%Q_PER_ROUND===0 ? "Round scoreboard" : "Next question"
        }</button>`:""}
    </div>
    ${!training?`
    <div class="panel booth-panel">
      <div class="subtle" style="margin-bottom:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase">Contestant booth</div>
      <div class="booths">
        ${state.players.map(p=>{
          const out = state.eliminated.includes(p.id);
          const active = state.active===p.id;
          const can = state.phase==="buzz" && !out && !state.paused;
          return `<div class="booth ${active?"active":""} ${out?"out":""}">
            <div class="dot" style="background:${COLORS[p.id]};margin:0 auto 6px;box-shadow:0 0 10px ${COLORS[p.id]}"></div>
            <div style="font-weight:700;font-size:18px" class="tabular">${p.score}</div>
            <div style="font-weight:600;font-size:13px">${escapeHtml(p.name)}</div>
            <button type="button" class="buzz-btn ${can?"live":""}" data-buzz="${p.id}" ${can?"":"disabled"}
              style="background:${can?COLORS[p.id]:"var(--subtle)"};color:${can?"#0a0e14":"var(--subtle-fg)"}">${out?"Out":active?"Locked in":"Buzz"} · Key ${p.id+1}</button>
          </div>`;
        }).join("")}
      </div>
    </div>`:`
    <div class="panel row" style="justify-content:space-between">
      <div><div class="subtle">Trainee</div><div style="font-weight:700">${escapeHtml(state.players[0].name)}</div></div>
      <div class="center"><div class="tabular" style="font-size:28px;font-weight:800">${state.players[0].score}</div><div class="subtle">${state.players[0].correct} correct · ${state.players[0].wrong} wrong</div></div>
    </div>`}
  </div>
  ${state.paused?`<div class="overlay"><div class="panel" style="max-width:400px;width:100%;text-align:center">
    <div style="font-size:32px;margin-bottom:8px">⏸</div>
    <h2 class="title">Game paused</h2>
    <p class="muted">Timer and reading are frozen.</p>
    <div class="stack" style="margin-top:16px">
      <button type="button" class="btn btn-primary btn-lg" id="resumeBtn">Resume</button>
      <button type="button" class="btn btn-secondary btn-lg" id="endBtn2">End game</button>
    </div>
    <div class="subtle" style="margin-top:10px">Esc or P to resume</div>
  </div></div>`:""}`;
}

function renderRound() {
  const rounds = Math.ceil(state.questions.length / Q_PER_ROUND);
  const ranked = state.players.map(p=>{
    const b = state.baseline[p.id] || {score:0,correct:0,wrong:0};
    return {...p, roundScore:p.score-b.score, roundCorrect:p.correct-b.correct, roundWrong:p.wrong-b.wrong};
  }).sort((a,b)=>b.roundScore-a.roundScore || b.score-a.score);
  return `
  <div class="stack">
    <div class="panel center">
      <div class="subtle" style="color:var(--host);font-weight:700">END OF ROUND ${state.completedRound} OF ${rounds}</div>
      <h1 class="title" style="margin-top:6px">Score update</h1>
      <p class="muted">5 questions down${ranked[0]?` · ${escapeHtml(ranked[0].name)} led this round`:""}</p>
    </div>
    <div class="glass host-card">
      <div class="host-avatar"><img src="${ARCHIE_SRC}" alt="Host Archie Sole" /></div>
      <div class="host-bubble">Round ${state.completedRound} in the books! Check the board — then Round ${state.completedRound+1}.</div>
    </div>
    <ol class="score-list">
      ${ranked.map((p,i)=>{
        const d = p.roundScore;
        const dl = d>0?`+${d}`:String(d);
        return `<li class="score-item ${i===0?"lead":""}">
          <span class="tabular subtle" style="width:20px;font-weight:700">${i+1}</span>
          <span class="dot" style="background:${COLORS[p.id]}"></span>
          <div class="grow"><div style="font-weight:600">${escapeHtml(p.name)}</div>
          <div class="subtle">This round: ${p.roundCorrect} correct · ${p.roundWrong} wrong</div></div>
          <div class="center"><div style="font-weight:700;color:${d>0?"var(--success)":d<0?"var(--danger)":"var(--muted)"}">${dl}</div>
          <div class="tabular" style="font-size:18px;font-weight:800">${p.score} <span class="subtle">total</span></div></div>
        </li>`;
      }).join("")}
    </ol>
    <button type="button" class="btn btn-primary btn-lg" id="nextRoundBtn">Start Round ${state.completedRound+1}</button>
    <button type="button" class="btn btn-secondary btn-lg" id="endBtn">End</button>
  </div>`;
}

function renderFinal() {
  const training = state.mode === "training";
  const ranked = [...state.players].sort((a,b)=>b.score-a.score || b.correct-a.correct);
  const top = ranked[0];
  const totalQ = state.questions.length;
  const acc = top && (top.correct+top.wrong)>0 ? Math.round(top.correct/(top.correct+top.wrong)*100) : 0;
  return `
  <div class="stack">
    <div class="panel center">
      <div style="font-size:36px;margin-bottom:8px">${training?"🎓":"🏆"}</div>
      <div class="subtle" style="color:var(--host);font-weight:700">${training?"TRAINING COMPLETE":"FINAL SCORES"}</div>
      <h1 class="title" style="margin-top:6px">${training?`${escapeHtml(top.name)}, you're done!`:`${escapeHtml(top.name)} takes the booth`}</h1>
      <p class="muted">${training?`${top.correct} of ${totalQ} correct · ${acc}% · ${top.score} pts`:"Product knowledge that shows up on the floor."}</p>
    </div>
    <div class="glass host-card">
      <div class="host-avatar"><img src="${ARCHIE_SRC}" alt="Host Archie Sole" /></div>
      <div class="host-bubble">${training
        ? (top.correct>=Math.ceil(totalQ*0.7)?`Solid training, ${escapeHtml(top.name)}! Ready for a showdown with the team?`:`Good effort — review the explanations and run it again.`)
        : `And the winner is ${escapeHtml(top.name)} with ${top.score} points!`}</div>
    </div>
    <ol class="score-list">
      ${ranked.map((p,i)=>`<li class="score-item ${i===0?"lead":""}">
        <span class="tabular subtle" style="width:20px;font-weight:700">${training?"★":i+1}</span>
        <span class="dot" style="background:${COLORS[p.id]}"></span>
        <div class="grow"><div style="font-weight:600">${escapeHtml(p.name)}</div>
        <div class="subtle">${p.correct} correct · ${p.wrong} wrong</div></div>
        <div class="tabular" style="font-size:22px;font-weight:800">${p.score}</div>
      </li>`).join("")}
    </ol>
    ${training ? renderReview() : ""}
    <div class="panel space-y">
      <div class="muted" style="font-weight:600">Download</div>
      <button type="button" class="btn btn-secondary btn-lg" id="dlResults">Results (.txt)</button>
      <button type="button" class="btn btn-secondary btn-lg" id="dlGuide">Study guide</button>
    </div>
    <button type="button" class="btn ${training?"btn-accent":"btn-primary"} btn-lg" id="againBtn">${training?"Train again":"Rematch"}</button>
    <button type="button" class="btn btn-secondary btn-lg" id="menuBtn">Back to menu</button>
  </div>`;
}

// Per-question review. "0 of 5 correct" told a trainee nothing about what to go
// study; this names every miss and prints the explanation next to it.
function renderReview() {
  const missed = state.questions.filter((q,i)=>!(state.answers[i]&&state.answers[i].correct));
  const cats = [...new Set(state.questions.map(q=>q.cat))];
  return `
    <div class="panel space-y">
      <div class="row" style="justify-content:space-between">
        <div class="muted" style="font-weight:600">Question review</div>
        <span class="chip" style="background:${missed.length?"rgba(248,113,113,0.15)":"rgba(52,211,153,0.15)"};color:${missed.length?"var(--danger)":"var(--success)"}">${missed.length?`${missed.length} missed`:"Clean sweep"}</span>
      </div>
      <div class="subtle">Covered ${cats.length} categories: ${escapeHtml(cats.join(" · "))}</div>
      ${missed.length?`<div class="muted">Archie: "Here's what got away from you — read the why on each one before you run it again."</div>`:`<div class="muted">Archie: "Perfect board. That's floor-ready."</div>`}
      <div class="review">
        ${state.questions.map((q,i)=>{
          const rec = state.answers[i] || {};
          const ok = !!rec.correct;
          const picked = (rec.picked==null) ? null : q.choices[rec.picked];
          return `<div class="review-item ${ok?"":"miss"}">
            <div class="row" style="justify-content:space-between;gap:6px">
              <span class="subtle">Q${i+1} · ${escapeHtml(q.cat)}</span>
              <span class="review-mark" style="color:${ok?"var(--success)":"var(--danger)"}">${ok?"✓ Correct":"✗ Missed"}</span>
            </div>
            <div class="review-q">${escapeHtml(q.q)}</div>
            ${ok?`<div class="subtle" style="margin-top:6px">Answer: ${escapeHtml(q.choices[q.a])}</div>`
                :`<div class="muted" style="margin-top:6px">You said: <strong style="color:var(--danger)">${picked===null?"nothing — the clock ran out":escapeHtml(picked)}</strong></div>
                  <div class="muted" style="margin-top:2px">Correct: <strong style="color:var(--fg)">${escapeHtml(q.choices[q.a])}</strong></div>
                  <div class="muted" style="margin-top:6px">${escapeHtml(q.why)}</div>`}
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function updateTimerUI() {
  const urgent = state.timerLeft <= 4;
  const col = urgent ? "var(--danger)" : state.timerLeft <= 10 ? "var(--warn)" : state.phase==="buzz" ? "var(--accent)" : "var(--p1)";
  const fill = document.getElementById("timerFill");
  if (fill) {
    const pct = Math.max(0, Math.min(1, state.timerLeft / state.timerTotal)) * 100;
    fill.style.width = pct + "%";
    fill.style.background = col; fill.style.color = col;
  }
  // The number is what the room actually watches. The old routine only moved
  // the bar, so the readout sat frozen on its opening value for the whole window.
  const sec = document.getElementById("timerSec");
  if (sec) {
    const txt = Math.ceil(state.timerLeft) + "s";
    if (sec.textContent !== txt) sec.textContent = txt;
    sec.style.color = urgent ? "var(--danger)" : "var(--fg)";
  }
}
// On a phone in landscape the contestant booth is pinned to the bottom of the
// screen. Nudge the page down so the question sits directly above the buzzers
// instead of behind them -- otherwise the row covers the prompt at scroll 0.
function fitBuzzers() {
  try {
    const bp = document.querySelector(".booth-panel");
    if (!bp || getComputedStyle(bp).position !== "fixed") return;
    window.scrollTo(0, document.documentElement.scrollHeight);
  } catch (e) {}
}

function renderPromptOnly() {
  const elp = document.getElementById("promptText");
  if (!elp) return;
  const q = state.questions[state.qi];
  const words = q.q.trim().split(/\s+/);
  const visible = words.slice(0, state.wordCount).join(" ");
  const speaking = state.phase==="intro" && state.wordCount < words.length && !state.paused;
  elp.innerHTML = escapeHtml(visible) + (speaking?'<span class="cursor"></span>':"");
}

function bind() {
  document.querySelectorAll("[data-mode]").forEach(b=>{
    b.onclick = () => { state.mode = b.getAttribute("data-mode"); if(state.mode==="training") state.names[0]= state.names[0]==="Player 1"?"Trainee":state.names[0]; render(); };
  });
  document.querySelectorAll("[data-count]").forEach(b=>{
    b.onclick = () => { state.playerCount = +b.getAttribute("data-count"); render(); };
  });
  document.querySelectorAll("[data-rounds]").forEach(b=>{
    b.onclick = () => { state.rounds = +b.getAttribute("data-rounds"); render(); };
  });
  document.querySelectorAll("[data-name]").forEach(inp=>{
    inp.oninput = () => { state.names[+inp.getAttribute("data-name")] = inp.value; };
  });
  const n0 = document.getElementById("name0");
  if (n0) n0.oninput = () => { state.names[0] = n0.value; };
  const start = document.getElementById("startBtn");
  if (start) start.onclick = startGame;
  const guide = document.getElementById("guideBtn");
  if (guide) guide.onclick = () => { unlockAudio(); sfx.select(); downloadStudyGuide(); };
  document.querySelectorAll("[data-buzz]").forEach(b=>{
    b.onclick = () => buzz(+b.getAttribute("data-buzz"));
  });
  document.querySelectorAll("[data-pick]").forEach(b=>{
    b.onclick = () => pickAnswer(+b.getAttribute("data-pick"));
  });
  const next = document.getElementById("nextBtn");
  if (next) next.onclick = continueAfterReveal;
  const nr = document.getElementById("nextRoundBtn");
  if (nr) nr.onclick = () => { unlockAudio(); sfx.start(); continueAfterRound(); };
  const pause = document.getElementById("pauseBtn");
  if (pause) pause.onclick = () => { unlockAudio(); togglePause(); };
  const resume = document.getElementById("resumeBtn");
  if (resume) resume.onclick = () => { unlockAudio(); sfx.select(); togglePause(); };
  const end = document.getElementById("endBtn");
  if (end) end.onclick = () => { clearTimers(); state.screen="setup"; state.paused=false; render(); };
  const end2 = document.getElementById("endBtn2");
  if (end2) end2.onclick = () => { clearTimers(); state.screen="setup"; state.paused=false; render(); };
  const again = document.getElementById("againBtn");
  if (again) again.onclick = startGame;
  const menu = document.getElementById("menuBtn");
  if (menu) menu.onclick = () => { state.screen="setup"; render(); };
  const dlr = document.getElementById("dlResults");
  if (dlr) dlr.onclick = () => { unlockAudio(); sfx.select(); downloadResults(); };
  const dlg = document.getElementById("dlGuide");
  if (dlg) dlg.onclick = () => { unlockAudio(); sfx.select(); downloadStudyGuide(); };
}

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  const t = e.target;
  if (t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;
  if (e.code==="Escape" || e.code==="KeyP") {
    if (state.screen==="play"||state.screen==="round") { e.preventDefault(); unlockAudio(); togglePause(); }
    return;
  }
  if (state.paused) return;
  if (state.screen!=="play") return;
  // Capture the phase before dispatching. buzz() flips state.phase to "answer"
  // inside this handler, and the old fall-through then ran pickAnswer() with the
  // same digit -- one keypress buzzed AND locked that letter as the answer, so
  // keyboard-only Showdown could never actually choose. One key, one action.
  const phase = state.phase;
  if (phase==="buzz" && e.code.startsWith("Digit")) {
    const n = +e.code.replace("Digit","");
    if (n>=1 && n<=state.players.length) { e.preventDefault(); buzz(n-1); }
    return;
  }
  if (phase==="answer" && e.code.startsWith("Digit")) {
    const n = +e.code.replace("Digit","");
    if (n>=1 && n<=4) { e.preventDefault(); pickAnswer(n-1); }
  }
  if (state.phase==="reveal" && (e.code==="Space"||e.code==="Enter")) {
    e.preventDefault(); continueAfterReveal();
  }
});

render();
</script>
</body>
</html>
