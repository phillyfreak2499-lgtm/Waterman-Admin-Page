// --- Performance: batched render + partial play updates ---
let _rafRender = 0;
let _renderOpts = null;
const PERF = {
  reducedMotion: typeof matchMedia==="function" && matchMedia("(prefers-reduced-motion: reduce)").matches,
  maxFloats: 8,
  historyWindow: 8,
  confettiParts: 36
};

function afterRender(){
  if(state.screen!=="play") return;
  const pane = document.getElementById("chatPane");
  if(pane){
    // Instant scroll (no smooth) — cheaper and more reliable mid-click
    pane.scrollTop = pane.scrollHeight;
  }
  const composer = document.getElementById("composer");
  if(composer && (state.crisis || state.kitchen)){
    composer.scrollTop = 0;
  }
  keepHandInView();
  requestAnimationFrame(()=>{ keepHandInView(); syncComposerAffordance(); });
  syncComposerAffordance();
  bindPlayDelegation();
  playMotionTicks();
}

// Give the interview card exactly the room that is left on screen, so the hand
// never has to hide behind a scroller that fits the viewport badly.
function keepHandInView(){
  const composer = document.getElementById("composer");
  if(!composer || !composer.querySelector(".choice, .action, .btn")) return;
  const vh = window.innerHeight || document.documentElement.clientHeight || 0;
  if(!vh) return;
  const r = composer.getBoundingClientRect();
  if(r.bottom <= vh - 2 && r.top >= -2) return;   // already fully on screen
  const y = (window.scrollY || window.pageYOffset || 0);
  const target = r.height >= vh - 20
    ? y + r.top - 6                                // taller than the screen: start at the top of it
    : y + r.bottom - vh + 10;                      // otherwise pull its last choice into view
  window.scrollTo(0, Math.max(0, Math.round(target)));
}

// Every dealt question should be visible; if a very long hand still has to
// scroll, say so instead of hiding it behind a hairline scrollbar.
function syncComposerAffordance(){
  const composer = document.getElementById("composer");
  if(!composer) return;
  const card = composer.closest(".interview-card");
  if(!card) return;
  if(!composer._scrollBound){
    composer._scrollBound = true;
    composer.addEventListener("scroll", syncComposerAffordance, { passive:true });
    window.addEventListener("resize", ()=>{ requestAnimationFrame(syncComposerAffordance); });
  }
  const more = (composer.scrollHeight - composer.clientHeight - composer.scrollTop) > 6;
  card.classList.toggle("composer-more", more);
}

function playMotionTicks(){
  if(PERF.reducedMotion) return;
  const vis = state._vis || (state._vis={ trust:-1, time:-1, price:-1, mood:"", seals:"" });
  const trustR = Math.round(state.trust);
  const timeR = Math.round(state.timePressure);
  const priceR = Math.round(state.priceHeat);
  if(vis.trust >= 0 && (vis.trust !== trustR || vis.time !== timeR || vis.price !== priceR)){
    document.querySelectorAll(".meter, .live-meter").forEach(el=>{
      el.classList.remove("bump");
      void el.offsetWidth;
      el.classList.add("bump");
    });
  }
  vis.trust = trustR; vis.time = timeR; vis.price = priceR;
  const mood = moodFromState();
  const face = document.querySelector(".face-wrap");
  if(face && vis.mood && vis.mood !== mood){
    face.classList.remove("mood-change");
    void face.offsetWidth;
    face.classList.add("mood-change");
  }
  vis.mood = mood;
  if(state.justOpened && state.justOpened.length){
    clearTimeout(state._justOpenTimer);
    state._justOpenTimer = setTimeout(()=>{
      if(state.justOpened && state.justOpened.length){
        state.justOpened = [];
        const board = document.querySelector(".file-board");
        if(board){
          const tmp = document.createElement("div");
          tmp.innerHTML = sealsHtml();
          if(tmp.firstChild) board.replaceWith(tmp.firstChild);
          keepHandInView(); syncComposerAffordance();
        }
      }
    }, 750);
  }
}

function render(opts){
  opts = opts || {};
  // Coalesce burst updates into one frame
  if(opts.async){
    _renderOpts = Object.assign({}, _renderOpts||{}, opts);
    if(_rafRender) return;
    _rafRender = requestAnimationFrame(function(){
      _rafRender = 0;
      const o = _renderOpts || {};
      _renderOpts = null;
      render(o);
    });
    return;
  }

  const app=document.getElementById("app");
  if(!app) return;

  // Partial play update when DOM shell already exists
  if(state.screen==="play" && opts.partial && app.querySelector(".interview-card") && app.querySelector("#chatPane")){
    updatePlayPartial();
    afterRender();
    return;
  }

  if(state.screen==="setup") app.innerHTML=renderSetup();
  else if(state.screen==="pattern") app.innerHTML=renderPattern();
  else if(state.screen==="play") app.innerHTML=renderPlay();
  else if(state.screen==="result") app.innerHTML=renderResult();
  bindSetup();
  afterRender();
}

function pickClient(opts){
  opts = opts || {};
  // Forced boss
  if(opts.bossId){
    const b = BOSS_CLIENTS.find(c=>c.id===opts.bossId);
    if(b && bossesUnlocked()) return b;
  }
  if(opts.forceBoss && bossesUnlocked()){
    const poolB = BOSS_CLIENTS.slice();
    if(state.client){ const f=poolB.filter(c=>c.id!==state.client.id); if(f.length) return f[Math.floor(Math.random()*f.length)]; }
    return poolB[Math.floor(Math.random()*poolB.length)];
  }
  let pool=CLIENTS.slice();
  // After 3 wins, small chance of boss encounter (25%) unless spouse focus filters
  if(bossesUnlocked() && !opts.noBoss && Math.random()<0.28){
    pool = pool.concat(BOSS_CLIENTS);
  }
  if(mode().spouseFocus) pool=pool.filter(c=>c.hasSpouse||(c.tags||[]).includes("dual")||(c.tags||[]).includes("spouse")||c.boss);
  if(state.client){ const f=pool.filter(c=>c.id!==state.client.id); if(f.length) pool=f; }
  return pool[Math.floor(Math.random()*pool.length)];
}

function startGame(opts){
  opts = opts || {};
  // pull name/store from fields if present
  const pn=document.getElementById("playerName"); const sn=document.getElementById("storeName");
  if(pn) state.playerName=pn.value.trim()||state.playerName;
  if(sn) state.storeName=sn.value.trim()||state.storeName;
  if(!state.playerName || !state.storeName){
    alert("Enter your name and store first.");
    return;
  }
  if((opts.forceBoss || opts.bossId) && !bossesUnlocked()){
    toast("Bosses locked","Win 3 full files first");
    return;
  }
  ensureAudio();
  const m=mode();
  state.client=pickClient(opts);
  state.turn=0; state.maxTurns=m.maxTurns;
  state.runSeed=Math.floor(Math.random()*100000); // rotates the 45 authored phrasings
  state.found=emptyFound(); state.justOpened=[]; state.asked=[]; state.lastFeedback=null; state.history=[];
  state.shuffled=shuffle(QUESTIONS); state.weakStreak=0; state.strongStreak=0; state.maxStrongStreak=0; state.strengths=[];
  state._vis={ trust:-1, time:-1, price:-1, mood:"", seals:"" };

  state.trust=startTrust; state.timePressure=startTime; state.priceHeat=startPrice; state.xp=0;
  state.turnLog=[];

function askQuestion(qid){
  const q=QUESTIONS.find(x=>x.id===qid);
  if(!q||state.asked.includes(qid)||state.crisis||state.kitchen) return;
  if(state.turn>=state.maxTurns) return;
  sfx("click");
  state.asked.push(qid); state.turn+=1;
  state.justOpened=[];
  const built=buildResponse(q);
  const newlyFound=[];
  built.canReveal.forEach(key=>{
    if(SEALS.includes(key) && !state.found[key]){ state.found[key]=true; newlyFound.push(key); state.justOpened.push(key); }
  });
  state.history.push({ question:questionText(q), response:built.text });
  state.strengths.push(q.strength);
  if(!state.turnLog) state.turnLog=[];
  state.turnLog.push({
    turn: state.turn,
    hit: newlyFound.length>0,
    detail: newlyFound.map(x=>SEAL_LABELS[x]).join("+") || "",
    note: (clientTraits().hates||[]).includes(q.id) ? "sore spot" : ((clientTraits().loves||[]).includes(q.id) ? "played to strength" : "")
  });
  if(q.strength==="weak"){ state.weakStreak+=1; state.strongStreak=0; }
  else if(q.strength==="strong"){
    state.weakStreak=0;
    state.strongStreak=(state.strongStreak||0)+1;
    if(state.strongStreak>(state.maxStrongStreak||0)) state.maxStrongStreak=state.strongStreak;
    if(state.strongStreak===3){
      unlockAch("clean_streak","Clean Streak","3 Strong questions in a row");
      floatText("3 STRONG STREAK!", "#f0c14b");
      sfx("crit");
    } else if(state.strongStreak>3 && state.strongStreak%3===0){
      floatText(state.strongStreak+" STRONG!", "#3ecf8e");
    }
  } else {
    state.weakStreak=0;
    state.strongStreak=0; // medium breaks the clean strong streak
  }
  const deltas=applyEffects(q, newlyFound);
  updateAdaptiveDifficulty(newlyFound);
  state.narrative=built.narrative||"";
  const hit=hitLabel(q.strength, newlyFound);
  let feedbackText="";
  if(newlyFound.length>=2){ feedbackText="Seals opened: "+newlyFound.map(t=>FULL[t]).join(" + ")+"."; sfx("crit"); floatText("+"+deltas.xpGain+" XP","#f0c14b"); newlyFound.forEach(t=>floatText(SEAL_LABELS[t]+" OPEN","#3ecf8e")); }
  else if(newlyFound.length===1){ feedbackText="Seal opened: "+FULL[newlyFound[0]]+"."; sfx("seal"); floatText(SEAL_LABELS[newlyFound[0]]+" OPEN","#3ecf8e"); floatText("+"+deltas.xpGain+" XP","#f0c14b"); }
  else if(q.strength==="weak"){ feedbackText="Nothing new toward the five seals. That turn is gone."; sfx("miss"); floatText("MISS","#ef6b6b"); }
  else { feedbackText="Useful path, but no new seal this time."; sfx("hit"); }

  if(deltas.trustDelta) floatText((deltas.trustDelta>0?"+":"")+deltas.trustDelta+" Trust", deltas.trustDelta>0?"#3ecf8e":"#ef6b6b");
  if(deltas.priceDelta>0) floatText("+"+deltas.priceDelta+" Price Heat","#e6a23c");

  if(deltas.trustDelta||deltas.priceDelta||deltas.timeDelta||deltas.xpGain){
    const bits=[];
    if(deltas.trustDelta) bits.push("Trust "+(deltas.trustDelta>0?"+":"")+deltas.trustDelta);
    if(deltas.priceDelta) bits.push("Price "+(deltas.priceDelta>0?"+":"")+deltas.priceDelta);
    if(deltas.timeDelta) bits.push("Time "+(deltas.timeDelta>0?"+":"")+deltas.timeDelta);
    if(deltas.xpGain) bits.push("+"+deltas.xpGain+" XP");
    feedbackText+=" · "+bits.join(" · ");
  }
  state.lastFeedback={ cls:hit.cls, tag:hit.tag, text:feedbackText, coaching:coachingText(q) };

  if(q.steal) state.stealLines.push(q.steal); // you used the line — you take it home
  if(newlyFound.includes("decision") && state.flags.spouseHinted) unlockAch("spouse_spotter","Spouse Spotter","You found the decision-maker barrier");
  if(newlyFound.length>=2) unlockAch("double_seal","Double Seal","Two seals in one question");
  if(countFound()===5 && state.turn<=5) unlockAch("speed_file","Speed File","Full file in 5 or fewer questions");

  // Mid-run pattern card after ~half turns
  const patternAt = state.patternAt || Math.max(2, Math.min(state.maxTurns-2, 2+Math.floor(Math.random()*Math.max(1,state.maxTurns-3))));
  state.patternAt = patternAt;
  const skipPattern = countFound()>=4 && Math.random()<0.4;
  if(!state.flags.patternShown && state.turn>=patternAt && countFound()<5 && !state.flags.crisisActive && !skipPattern){
    state.flags.patternShown=true; // set when continuing; show screen now
    // Actually show pattern screen
    const crisis=maybeCrisis(q);
    if(crisis){ state.crisis=crisis; state.flags.crisisActive=true; sfx("crisis"); toast(crisis.title,"Saving throw required"); render({partial:true}); return; }
    state.flags.patternShown=false; // will set true on continue
    state.screen="pattern";
    sfx("pattern");
    render({partial:false});
    // re-bind pattern continue
    setTimeout(()=>{
      const b=document.getElementById("continuePattern");
      if(b) b.onclick=continuePattern;
    },0);
    return;
  }

  const crisis=maybeCrisis(q);
  if(crisis){ state.crisis=crisis; state.flags.crisisActive=true; sfx("crisis"); toast(crisis.title,"Saving throw required"); render({partial:true}); return; }

  // Kitchen table when file complete or turns almost out
  if(!state.flags.kitchenDone && !state.kitchen){
    if(countFound()===5 || state.turn>=state.maxTurns || state.timePressure>=100){
      state.kitchen=true;
      sfx("crisis");
      toast("Kitchen-table moment","Own it — don't escape");
      render({partial:true});
      return;
    }
  }

  render({partial:true});
}

function chooseRecovery(optId){
  const opt=RECOVERY.find(o=>o.id===optId); if(!opt) return;
  state.diceRolling=true; state.diceValue="?"; render();
  let ticks=0;
  const iv=setInterval(()=>{
    state.diceValue=Math.floor(Math.random()*20)+1;
    const face=document.getElementById("diceFace");
    if(face) face.textContent=state.diceValue;
    ticks++;
    if(ticks>=8){
      clearInterval(iv);
      state.diceRolling=false;
      const roll=Math.min(20, (state.diceValue||10)+(opt.good?4:0));
      state.diceValue=roll;
      finishRecovery(opt);
    }
  },80);
}
function finishRecovery(opt){
  state.recoveriesUsed+=1;
  state.trust=clamp(state.trust+opt.trust,0,100);
  state.priceHeat=clamp(state.priceHeat+opt.price,0,100);
  state.timePressure=clamp(state.timePressure+opt.time,0,100);
  if(opt.good){ state.recoveriesWon+=1; state.xp+=20; sfx("save"); floatText("SAVE!","#3ecf8e"); unlockAch("clutch","Clutch Recovery","Won a saving throw"); }
  else { sfx("fail"); floatText("FAIL","#ef6b6b"); }
  state.flags.crisisActive=false; state.flags.crisisResolved+=1; state.crisis=null;
  state.weakStreak=0;
  state.lastFeedback={
    cls:opt.good?"critical":"miss",
    tag:opt.good?"d20 → SAVE":"d20 → FAIL",
    text:opt.feedback+" (roll: "+state.diceValue+")",
    coaching:opt.good?"Pattern: Reconnect and own the concern — don't escape into discounts.":"Pattern: Escaping to discount/step-down digs the hole deeper."
  };
  state.narrative=opt.good?"The tension eases. They're still here. Keep building the file.":"The Client is colder now. You'll need strong questions to recover.";
  state.diceValue=null;

  if(!state.flags.kitchenDone && (countFound()===5 || state.turn>=state.maxTurns || state.timePressure>=100)){
    state.kitchen=true; render(); return;
  }
  render({partial:true});
}

function chooseKitchen(optId){
  const opt=KITCHEN.options.find(o=>o.id===optId); if(!opt) return;
  state.kitchenResult=opt;
  state.kitchen=false;
  state.flags.kitchenDone=true;
  if(opt.good){
    state.trust=clamp(state.trust+8,0,100);
    state.priceHeat=clamp(state.priceHeat-10,0,100);
    state.xp+=15; sfx("save"); floatText("OWNED","#3ecf8e");
    unlockAch("no_escape","No Escape","Answered without stepping down");
    if(opt.steal) state.stealLines.push(opt.steal);
  } else {
    state.trust=clamp(state.trust-10,0,100);
    state.priceHeat=clamp(state.priceHeat+15,0,100);
    sfx("fail"); floatText("ESCAPED","#ef6b6b");
  }
  state.lastFeedback={
    cls:opt.good?"critical":"miss",
    tag:opt.good?"CLOSE DISCIPLINE":"ESCAPE MOVE",
    text:opt.feedback,
    coaching:opt.good?"Answer fully, reconnect to goal, protect the complete solution.":"Stepping down without answering is escape. Own value first."
  };
  state.narrative=opt.good?"You owned the kitchen-table moment. The file has a chance to survive at home.":"You escaped. The Client learned the price was soft — or left with the file incomplete.";
  setTimeout(()=>endGame(),700);
  render({partial:true});
}

function computeScore(){
  const foundCount=countFound();
  const turnsUsed=state.turn;
  const owned=!!(state.kitchenResult && state.kitchenResult.good);
  let score=foundCount*12;
  if(foundCount===5){
    // A complete file is a complete file. Efficiency shades the band instead of
    // cliff-edging it, so the same good interview lands on the same verdict.
    const efficiency=Math.max(0,state.maxTurns-turnsUsed);
    score = 58 + Math.min(18, efficiency*4);
  }
  if(owned) score+=15;
  else if(state.kitchenResult) score-=10;
  const weaks=state.strengths.filter(s=>s==="weak").length;
  score-=weaks*3;
  score+=state.recoveriesWon*5;
  score-=Math.max(0,state.recoveriesUsed-state.recoveriesWon)*4;
  if(state.trust>=70) score+=5;
  if(state.trust<=25) score-=5;
  if(state.priceHeat>=80) score-=6;
  if(state.found.decision) score+=5;
  score=clamp(score,0,100);
  return { score, foundCount, turnsUsed, weaks, owned };
}

function confetti(){
  if(PERF.reducedMotion) return;
  const c=document.createElement("canvas");
  c.className="confetti"; c.width=window.innerWidth; c.height=window.innerHeight;
  c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:9999";
  document.body.appendChild(c);
  const ctx=c.getContext("2d",{ alpha:true });
  const n = PERF.confettiParts;
  const parts=new Array(n);
  const colors=["#1ab8a6","#d4a017","#3ecf8e","#ef6b6b","#60a5fa"];
  for(let i=0;i<n;i++) parts[i]={ x:Math.random()*c.width, y:-20-Math.random()*c.height*0.25, r:2+Math.random()*4, c:colors[i%5], vx:-2+Math.random()*4, vy:2+Math.random()*3.5, a:1 };
  let frames=0;
  function frame(){
    frames++;
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=0;i<n;i++){
      const p=parts[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.a-=0.012;
      if(p.a<=0) continue;
      ctx.globalAlpha=p.a; ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.r,p.r*1.3);
    }
    if(frames<70) requestAnimationFrame(frame); else c.remove();
  }
  requestAnimationFrame(frame);
}

function endGame(){
  state.crisis=null; state.kitchen=false; state.screen="result"; state.lastFeedback=null;
  const { score, foundCount, owned, weaks }=computeScore();
  try { if (window.QuadScore) window.QuadScore.report(score); } catch(e){}
  const perfect = foundCount===5 && weaks===0 && owned;
  state.runPerfect = perfect;
  if(perfect){
    unlockAch("perfect_file","Perfect File","5 seals · 0 Weak · owned the close");
    floatText("PERFECT FILE!", "#f0c14b");
  }
  if(state.client && state.client.boss && foundCount===5 && owned){
    unlockAch("boss_slayer","Boss Slayer","You beat a BOSS case clean");
  }
  if((state.maxStrongStreak||0)>=3) unlockAch("clean_streak","Clean Streak","3 Strong in a row this case");
  if(foundCount===5 && owned){ sfx("win"); confetti(); }
  else if(perfect){ sfx("win"); confetti(); }
  render();
  setTimeout(()=>{
    const b=document.getElementById("saveReflection");
    if(b) b.onclick=saveReflectionAndStay;
  },0);
}

function saveReflectionAndStay(){

function downloadGame(){
  const name = "Client_Case_File.html";
  const done = (blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast("Download started", "Send Client_Case_File.html — open in any browser, no install");
  };
  (async () => {
    // 1) Dedicated file  2) current URL  3) rebuild from DOM
    const tryUrls = ["/Client_Case_File.html", "./Client_Case_File.html", window.location.href.split("#")[0].split("?")[0]];
    for (const url of tryUrls) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) continue;
        const blob = await res.blob();
        if (blob.size > 10000) { done(blob); return; }
      } catch (e) {}
    }
    // Offline / file:// fallback: serialize full page (self-contained)
    try {
      const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      done(new Blob([html], { type: "text/html;charset=utf-8" }));
    } catch (e) {
      toast("Download blocked", "Use the file link from your professor, or right-click → Save As");
    }
  })();
}


function printScorecard(){
  const el = document.getElementById("printScorecard");
  if(!el){ window.print(); return; }
  // Ensure latest reflection is on the card
  const ref = (document.getElementById("reflectionInput")?.value||"").trim();
  if(ref){
    state.reflection = ref;
    // update commitment line if present
    const sections = el.querySelectorAll(".sc-section");
    sections.forEach(sec=>{
      const h = sec.querySelector("h4");
      if(h && /commitment/i.test(h.textContent||"")){
        const p = sec.querySelector("p");
        if(p) p.textContent = ref;
      }
    });
  }
  window.print();
}

function copyDebrief(){
  const c=state.client; const { score, foundCount, turnsUsed, weaks, owned }=computeScore();
  const foundList=SEALS.map(t=>(state.found[t]?"✓":"✗")+" "+FULL[t]).join("\n");
  const text="Client Case File — Debrief\nSpecialist: "+state.playerName+"\nStore: "+state.storeName+
    "\nMode: "+mode().title+"\nClient: "+c.name+" ("+c.className+")\nScore: "+score+" | XP: "+state.xp+
    "\nSeals: "+foundCount+"/5 in "+turnsUsed+" questions (Weak: "+weaks+")\nKitchen table: "+(owned?"OWNED":"ESCAPED/INCOMPLETE")+
    "\nTrust: "+Math.round(state.trust)+" | Price: "+priceLabel()+" | Time: "+timeLabel()+
    "\n\n"+foundList+
    "\n\nCoaching focus next shift:\n- One decision-process / who-else question before the cart every time\n- Map Job, Pain location/timing, and everyday shoes early\n- Answer objections fully before any step-down\n- Don't poke price before value and decision clarity\n\nA Remarkable Experience. Every Client. Every time.";
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("Debrief copied","Paste into a note or email")).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Debrief copied"); }catch(e){ alert("Copy failed."); }
  document.body.removeChild(ta);
}

document.addEventListener("click", e=>{ if(e.target&&e.target.id==="startBtn") startFromSetup(); });
window.askQuestion=askQuestion; window.chooseRecovery=chooseRecovery; window.chooseKitchen=chooseKitchen;
window.startGame=startGame; window.endGame=endGame; window.copyDebrief=copyDebrief; window.printScorecard=printScorecard; window.downloadGame=downloadGame;
window.toggleSound=function(){ soundOn=!soundOn; const b=document.getElementById("soundBtn"); if(b) b.textContent=soundOn?"Sound on":"Sound off"; if(soundOn){ ensureAudio(); sfx("click"); } };

render();

</script>
