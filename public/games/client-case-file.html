<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0c1220"/>
<title>Client Case File — Interview for Reality</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap&family=Source+Sans+3:wght@400;500;600;700&display=swap');
:root{
  --bg:#0c1220; --surface:#142033; --surface2:#1a2a42; --ink:#e8eef6; --muted:#8b9bb0;
  --teal:#1ab8a6; --teal-d:#0f766e; --gold:#d4a017; --gold-l:#f0c14b;
  --good:#3ecf8e; --bad:#ef6b6b; --warn:#e6a23c; --line:rgba(148,163,184,.18);
  --shadow:0 10px 36px rgba(0,0,0,.35); --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;}
body{
  font-family:"Source Sans 3",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 480px at 8% -8%, rgba(26,184,166,.14), transparent 55%),
    radial-gradient(700px 400px at 100% 0%, rgba(212,160,23,.08), transparent 50%),
    linear-gradient(180deg,#0a101c 0%, #0c1220 50%, #0e1626 100%);
  line-height:1.45; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.05; z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23fff' fill-opacity='1'%3E%3Cpath d='M0 0h1v1H0zm20 20h1v1h-1z'/%3E%3C/g%3E%3C/svg%3E");
}
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:12px 12px 80px}
.header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 12px; margin-bottom:12px; box-shadow:var(--shadow);
}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.logo-w{height:28px;width:auto;object-fit:contain;filter:brightness(1.12)}
.logo-c{height:40px;width:40px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;box-shadow:0 0 0 2px rgba(26,184,166,.35)}
.htitle{font-family:"Cormorant Garamond",serif;font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:.02em}
.hsub{font-size:.68rem;color:var(--teal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.stats{display:flex;gap:6px}
.stat{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:5px 9px;text-align:center;min-width:52px;font-size:.68rem;color:var(--muted)}
.stat strong{display:block;font-family:"Cormorant Garamond",serif;font-size:1.05rem;color:var(--gold-l);line-height:1.1}
.meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow)}
.meter .ml{font-size:.58rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:5px}
.mbar{height:9px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.mfill{height:100%;border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.mval{font-size:.72rem;font-weight:600;margin-top:4px}
.file-board{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;
}
.seal{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:10px 4px 8px; text-align:center; transition:all .25s; box-shadow:var(--shadow);
  position:relative; min-height:78px;
}
.seal.open{border-color:rgba(62,207,142,.55);background:rgba(12,70,50,.4);transform:translateY(-2px);box-shadow:0 0 18px rgba(62,207,142,.18)}
.seal.boss{border-color:rgba(212,160,23,.35)}
.seal.boss.open{border-color:rgba(212,160,23,.65);background:rgba(80,55,10,.35)}
.seal .s-icon{width:28px;height:28px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center}
.seal .s-icon svg{width:24px;height:24px}
.seal .s-label{font-size:.52rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.seal .s-state{font-size:.72rem;font-weight:700;margin-top:2px;color:var(--muted)}
.seal.open .s-state{color:var(--good)}
.seal.boss.open .s-state{color:var(--gold-l)}
@keyframes sealPop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.seal.just-open{animation:sealPop .35s ease}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); margin-bottom:12px;
}
.card h2{font-family:"Cormorant Garamond",serif;font-size:1.2rem;color:#fff;margin-bottom:6px}
.card h3{font-family:"Cormorant Garamond",serif;font-size:1rem;color:var(--gold-l);margin:12px 0 6px}
.card p{margin-bottom:8px;font-size:.9rem}
.banner{
  background:linear-gradient(90deg,rgba(26,184,166,.18),rgba(212,160,23,.1));
  border:1px solid rgba(26,184,166,.3); border-radius:12px; padding:12px 14px;
  margin-bottom:12px; font-size:.86rem; color:var(--ink);
}
.banner strong{color:var(--gold-l)}
.client-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.avatar{
  width:54px;height:54px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:"Cormorant Garamond",serif;font-weight:700;font-size:1.15rem;color:#fff;
  border:2px solid rgba(255,255,255,.15); box-shadow:0 6px 16px rgba(0,0,0,.3);
}
.cname{font-size:.66rem;color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ctitle{font-family:"Cormorant Garamond",serif;font-size:1.1rem;color:#fff}
.crole{font-size:.8rem;color:var(--muted)}
.narrative{
  background:rgba(212,160,23,.08); border-left:3px solid var(--gold);
  padding:10px 12px; border-radius:0 10px 10px 0; margin:8px 0; font-size:.86rem; font-style:italic; color:#f5e6c0;
}
.dialogue{background:rgba(0,0,0,.22);border-left:3px solid var(--teal);padding:10px 12px;border-radius:0 10px 10px 0;margin:7px 0;font-size:.88rem}
.dialogue.you{border-left-color:var(--gold);background:rgba(212,160,23,.06)}
.dialogue .who{font-size:.62rem;color:var(--teal);font-weight:700;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.dialogue.you .who{color:var(--gold-l)}
.history{max-height:none;overflow:visible}
.feedback{margin-top:10px;padding:12px;border-radius:12px;font-size:.84rem;display:none;animation:in .3s ease}
.feedback.show{display:block}
.feedback.critical{background:rgba(12,70,50,.55);color:#b6f0d0;border:1px solid rgba(62,207,142,.4)}
.feedback.solid{background:rgba(20,50,90,.5);color:#c5daf7;border:1px solid rgba(100,160,230,.4)}
.feedback.glance{background:rgba(90,55,10,.45);color:#f5d99a;border:1px solid rgba(230,162,60,.35)}
.feedback.miss{background:rgba(90,25,25,.5);color:#f5c0c0;border:1px solid rgba(239,107,107,.4)}
.feedback .tag{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:.85rem;letter-spacing:.04em;display:block;margin-bottom:3px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pattern-card{
  background:linear-gradient(135deg,rgba(20,42,70,.95),rgba(15,60,70,.9));
  border:1px solid rgba(26,184,166,.45); border-radius:14px; padding:16px; margin:12px 0;
  animation:in .3s ease; box-shadow:0 0 24px rgba(26,184,166,.15);
}
.pattern-card h3{color:var(--teal);margin:0 0 8px;font-family:"Cormorant Garamond",serif}
.kitchen{
  background:linear-gradient(135deg,rgba(90,40,10,.9),rgba(50,20,5,.95));
  border:1px solid rgba(212,160,23,.5); border-radius:14px; padding:16px; margin:12px 0;
  animation:shake .4s ease;
}
.kitchen h3{color:var(--gold-l);margin:0 0 8px;font-family:"Cormorant Garamond",serif;font-size:1.15rem}
.kitchen p{color:#f5e6c0;font-size:.88rem}
.crisis{
  background:linear-gradient(135deg,rgba(90,20,20,.9),rgba(50,10,10,.95));
  border:1px solid rgba(239,107,107,.45); border-radius:14px; padding:16px; margin:12px 0;
  animation:shake .4s ease;
}
.crisis h3{color:#f5c0c0;margin:0 0 8px;font-family:"Cormorant Garamond",serif}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice,.action{
  display:block;width:100%;text-align:left;background:rgba(0,0,0,.28);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;font-size:.88rem;color:var(--ink);cursor:pointer;
  font-family:inherit;line-height:1.35;min-height:48px;transition:all .15s;
}
.choice:hover,.action:hover{border-color:var(--teal);background:rgba(26,184,166,.1);transform:translateY(-1px)}
.choice:active,.action:active{transform:scale(.99)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:1rem;
  font-family:inherit;color:var(--ink);background:rgba(0,0,0,.28);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,184,166,.2)}
.mode-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0 14px}
@media(min-width:560px){.mode-grid{grid-template-columns:1fr 1fr}}
.mode{
  border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:rgba(0,0,0,.22);
  text-align:left;font-family:inherit;color:var(--ink);transition:all .15s;
}
.mode:hover{border-color:var(--teal)}
.mode.on{border-color:var(--teal);background:rgba(26,184,166,.12);box-shadow:0 0 0 1px var(--teal)}
.mode .mt{font-family:"Cormorant Garamond",serif;font-weight:700;color:#fff;font-size:.95rem}
.mode .md{font-size:.78rem;color:var(--muted);margin-top:2px}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{
  flex:1;min-width:120px;padding:14px;border:none;border-radius:12px;font-size:.9rem;font-weight:700;
  cursor:pointer;font-family:inherit;min-height:48px;transition:all .15s;
}
.btn-p{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#042f2e;box-shadow:0 4px 18px rgba(26,184,166,.3)}
.btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-s{background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line)}
.btn-s:hover{border-color:var(--teal)}
.intro li{margin:4px 0 4px 18px;font-size:.88rem}
.footer{text-align:center;font-size:.68rem;color:var(--muted);margin-top:16px;opacity:.85}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{font-size:.72rem;background:rgba(26,184,166,.12);color:var(--teal);padding:4px 10px;border-radius:999px;font-weight:600;border:1px solid rgba(26,184,166,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.chip{font-size:.68rem;font-weight:700;padding:4px 9px;border-radius:8px;background:rgba(26,184,166,.12);color:var(--teal);border:1px solid rgba(26,184,166,.25)}
.chip.warn{background:rgba(230,162,60,.12);color:var(--warn);border-color:rgba(230,162,60,.3)}
.chip.bad{background:rgba(239,107,107,.12);color:var(--bad);border-color:rgba(239,107,107,.3)}
.chip.good{background:rgba(62,207,142,.12);color:var(--good);border-color:rgba(62,207,142,.3)}
.result{text-align:center}
.result .score{font-family:"Cormorant Garamond",serif;font-size:3.2rem;font-weight:700;color:var(--gold-l);line-height:1;text-shadow:0 0 28px rgba(212,160,23,.35)}
.result .slabel{font-size:.78rem;color:var(--muted);margin-bottom:10px}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;font-family:"Cormorant Garamond",serif;font-size:.8rem;font-weight:700;margin-bottom:10px;letter-spacing:.04em}
.badge.win{background:rgba(12,70,50,.6);color:#b6f0d0;border:1px solid rgba(62,207,142,.4)}
.badge.part{background:rgba(90,55,10,.5);color:#f5d99a;border:1px solid rgba(230,162,60,.35)}
.badge.lose{background:rgba(90,25,25,.5);color:#f5c0c0;border:1px solid rgba(239,107,107,.4)}
.reveal{text-align:left;background:rgba(0,0,0,.22);border-radius:12px;padding:12px;margin:12px 0;border:1px solid var(--line)}
.reveal div{padding:7px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.reveal div:last-child{border-bottom:none}
.yes{color:var(--good);font-weight:700}
.no{color:var(--muted)}
.box{background:rgba(26,184,166,.08);border:1px solid rgba(26,184,166,.25);border-radius:12px;padding:12px;margin-top:10px;text-align:left;font-size:.84rem}
.box.debrief{background:rgba(40,80,140,.12);border-color:rgba(100,160,230,.3)}
.box strong{color:var(--gold-l);font-family:"Cormorant Garamond",serif}
.box ul{margin:6px 0 0 16px}
.box li{margin-bottom:4px}
.takeaway{
  background:linear-gradient(135deg,rgba(12,18,32,.95),rgba(15,80,70,.4));
  border:1px solid rgba(26,184,166,.3); color:#fff; border-radius:12px; padding:14px; margin-top:12px; text-align:left; font-size:.86rem;
}
.takeaway .lab{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:4px;font-weight:700}
.steal{
  background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.4);border-radius:12px;padding:12px;margin-top:10px;text-align:left;
}
.steal .lab{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-l);font-weight:700;margin-bottom:4px}
.steal .line{font-size:.92rem;font-weight:600;color:#fff;font-style:italic}
.table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.table th,.table td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.table th{color:var(--muted);font-size:.68rem;text-transform:uppercase}
.muted{color:var(--muted);font-size:.82rem}
.pressure{background:rgba(90,55,10,.35);border:1px solid rgba(230,162,60,.35);color:#f5d99a;padding:10px 12px;border-radius:10px;font-size:.8rem;margin:9px 0;display:none}
.pressure.show{display:block}
.float-layer{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.float-txt{position:absolute;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:1.1rem;animation:up 1.1s ease forwards;text-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap}
@keyframes up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-55px)}}
.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-130%);
  background:linear-gradient(135deg,#142033,#0f766e);border:1px solid var(--gold);
  color:#fff;padding:12px 18px;border-radius:12px;z-index:200;font-size:.86rem;
  box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:90vw;text-align:center;
  font-family:"Cormorant Garamond",serif;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .ts{font-family:"Source Sans 3",sans-serif;font-size:.75rem;color:var(--teal);margin-top:2px}
.sound-btn{
  position:fixed;bottom:14px;right:14px;z-index:50;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:rgba(20,32,51,.92);color:var(--ink);cursor:pointer;
  font-size:1rem;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150}
.dice-row{display:flex;gap:10px;align-items:center;margin:12px 0;justify-content:center}
.dice{
  width:52px;height:52px;border-radius:12px;background:linear-gradient(145deg,#1e293b,#0f172a);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:"Cormorant Garamond",serif;font-size:1.35rem;font-weight:700;color:var(--gold-l);
}
.dice.roll{animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){
  .file-board{grid-template-columns:repeat(3,1fr)}
  .meters{grid-template-columns:1fr}
  .hsub{max-width:130px}
}
@media(max-width:400px){
  .file-board{grid-template-columns:repeat(2,1fr)}
  .logo-w{height:22px}
  .logo-c{height:34px;width:34px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}


/* Printable scorecard */
.scorecard{
  display:none;
  background:#fff; color:#111; border:2px solid #0c1220; border-radius:8px;
  padding:18px 20px; margin:14px 0; text-align:left; font-family:"Source Sans 3",system-ui,sans-serif;
}
.scorecard.show-on-screen{display:block; background:var(--surface); color:var(--ink); border-color:var(--line)}
.scorecard .sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid currentColor;padding-bottom:10px;margin-bottom:12px}
.scorecard .sc-title{font-family:"Cormorant Garamond",serif;font-size:1.35rem;font-weight:700;letter-spacing:.03em}
.scorecard .sc-meta{font-size:.78rem;opacity:.85;margin-top:2px}
.scorecard .sc-score-box{text-align:right}
.scorecard .sc-score-num{font-family:"Cormorant Garamond",serif;font-size:2.4rem;font-weight:700;line-height:1}
.scorecard .sc-badge{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.scorecard .sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:10px 0;font-size:.84rem}
.scorecard .sc-grid div span{display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;opacity:.7;font-weight:700}
.scorecard .sc-seals{width:100%;border-collapse:collapse;font-size:.82rem;margin:10px 0}
.scorecard .sc-seals th,.scorecard .sc-seals td{border:1px solid rgba(0,0,0,.2);padding:7px 8px;text-align:left;vertical-align:top}
.scorecard.show-on-screen .sc-seals th,.scorecard.show-on-screen .sc-seals td{border-color:var(--line)}
.scorecard .sc-seals th{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em}
.scorecard .sc-check{font-weight:700;width:28px;text-align:center}
.scorecard .sc-section{margin-top:12px;font-size:.84rem}
.scorecard .sc-section h4{font-family:"Cormorant Garamond",serif;font-size:.95rem;margin-bottom:4px;border-bottom:1px solid rgba(0,0,0,.15);padding-bottom:3px}
.scorecard.show-on-screen .sc-section h4{border-color:var(--line)}
.scorecard .sc-section ul{margin:4px 0 0 16px}
.scorecard .sc-section li{margin-bottom:3px}
.scorecard .sc-sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px;padding-top:12px;border-top:1px solid rgba(0,0,0,.2);font-size:.78rem}
.scorecard.show-on-screen .sc-sign{border-color:var(--line)}
.scorecard .sc-line{border-bottom:1px solid #333;height:28px;margin-top:4px}
.scorecard.show-on-screen .sc-line{border-color:var(--muted)}
.scorecard .sc-foot{margin-top:12px;font-size:.68rem;opacity:.75;text-align:center}
.no-print{}
@media print{
  body{background:#fff!important;color:#000!important}
  body::before{display:none!important}
  .app{max-width:100%;padding:0;margin:0}
  .header,.meters,.file-board,.sound-btn,.float-layer,.toast,.confetti,.no-print{display:none!important}
  .card{box-shadow:none!important;border:none!important;background:#fff!important;padding:0!important;margin:0!important}
  .scorecard,.scorecard.show-on-screen{
    display:block!important; background:#fff!important; color:#000!important;
    border:2px solid #000!important; border-radius:0!important; box-shadow:none!important;
    padding:12px!important; margin:0!important; page-break-inside:avoid;
  }
  .scorecard .sc-seals th,.scorecard .sc-seals td{border-color:#000!important}
  .scorecard .sc-line{border-color:#000!important}
  .result > *:not(.scorecard):not(.print-only-wrap){display:none!important}
  .print-only-wrap{display:block!important}
}


/* Side panels + live client */
.play-shell{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
@media(min-width:960px){
  .play-shell{grid-template-columns:200px minmax(0,1fr) 210px}
}
@media(min-width:1100px){
  .play-shell{grid-template-columns:220px minmax(0,1fr) 230px}
  .app{max-width:1180px}
}
.side-panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; box-shadow:var(--shadow); position:sticky; top:10px;
}
.side-panel h4{
  font-family:"Cormorant Garamond",serif; font-size:.92rem; color:var(--gold-l);
  margin:0 0 8px; letter-spacing:.03em;
}
.side-panel .sp-sub{font-size:.68rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tracker-seal{
  display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.78rem;
}
.tracker-seal:last-child{border-bottom:none}
.tracker-dot{
  width:10px;height:10px;border-radius:50%;background:rgba(139,155,176,.35);flex-shrink:0;
  border:1px solid var(--line);
}
.tracker-dot.open{background:var(--good);border-color:var(--good);box-shadow:0 0 8px rgba(62,207,142,.5)}
.tracker-dot.boss{background:rgba(212,160,23,.25);border-color:rgba(212,160,23,.4)}
.tracker-dot.boss.open{background:var(--gold-l);border-color:var(--gold-l);box-shadow:0 0 8px rgba(240,193,75,.45)}
.tracker-log{max-height:140px;overflow-y:auto;margin-top:8px;font-size:.72rem}
.tracker-log div{padding:4px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.tracker-log .hit{color:var(--good)}
.tracker-log .miss{color:var(--bad)}
.diff-pill{
  display:inline-block;font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:999px;
  letter-spacing:.04em;text-transform:uppercase;margin-top:4px;
}
.diff-easy{background:rgba(62,207,142,.15);color:var(--good);border:1px solid rgba(62,207,142,.35)}
.diff-med{background:rgba(230,162,60,.15);color:var(--warn);border:1px solid rgba(230,162,60,.35)}
.diff-hard{background:rgba(239,107,107,.15);color:var(--bad);border:1px solid rgba(239,107,107,.35)}
.trait-list{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.4}
.trait-list strong{color:var(--ink);font-weight:600}
.client-stage{text-align:center; padding:8px 4px 4px}
.face-wrap{
  width:140px;height:140px;margin:0 auto 8px; position:relative;
  border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), transparent 50%),
    linear-gradient(160deg, var(--face-a, #0d9488), var(--face-b, #134e4a));
  border:3px solid rgba(255,255,255,.15); box-shadow:0 8px 28px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center; overflow:hidden;
  transition: box-shadow .35s ease, border-color .35s ease, filter .35s ease;
}
.face-wrap.trust-high{border-color:rgba(62,207,142,.55); box-shadow:0 0 24px rgba(62,207,142,.25)}
.face-wrap.trust-mid{border-color:rgba(26,184,166,.35)}
.face-wrap.trust-low{border-color:rgba(239,107,107,.45); box-shadow:0 0 20px rgba(239,107,107,.2); filter:saturate(.85)}
.face-wrap.trust-crisis{border-color:rgba(239,107,107,.7); animation:pulseFace 1s ease infinite}
@keyframes pulseFace{0%,100%{box-shadow:0 0 12px rgba(239,107,107,.2)}50%{box-shadow:0 0 28px rgba(239,107,107,.45)}}
.face-svg{width:100px;height:100px}
.face-mood{font-size:.72rem;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.face-mood.low{color:var(--bad)}
.face-mood.high{color:var(--good)}
.face-mood.crisis{color:var(--bad)}
.face-quote{
  font-size:.75rem; font-style:italic; color:var(--muted); line-height:1.35;
  min-height:2.6em; margin:6px 0 8px; padding:0 4px;
}
.live-meter{margin:6px 0}
.live-meter .lm-lab{font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.live-meter .lm-bar{height:6px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;margin-top:3px}
.live-meter .lm-fill{height:100%;border-radius:99px;transition:width .4s ease}
.mobile-sides{margin-bottom:10px}
.ms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:960px){.mobile-sides{display:none}}
/* Small-screen coaching drawer — same content the desktop side panels carry */
.mobile-coach{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-top:8px; overflow:hidden;
}
.mobile-coach>summary{
  list-style:none; cursor:pointer; padding:9px 12px;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-l);
}
.mobile-coach>summary::-webkit-details-marker{display:none}
.mobile-coach>summary::marker{content:""}
.mobile-coach .mc-sum-sub{color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:none;font-size:.68rem}
.mobile-coach .mc-caret{color:var(--teal);transition:transform .2s ease}
.mobile-coach[open] .mc-caret{transform:rotate(180deg)}
.mobile-coach .mc-body{padding:10px 12px 12px;border-top:1px solid var(--line)}
.mobile-coach .mc-body .hint-tag{margin-top:0}
.mobile-coach .mc-quote{
  font-size:.75rem; font-style:italic; color:var(--muted); line-height:1.35; margin:8px 0 0;
}
.mobile-coach .mc-quote span{font-style:normal;color:var(--teal);font-weight:700}
@media(max-width:959px){.side-panel.desktop-only{display:none}}
.hint-tag{
  font-size:.68rem; background:rgba(212,160,23,.1); border:1px solid rgba(212,160,23,.3);
  color:var(--gold-l); border-radius:8px; padding:6px 8px; margin-top:8px; text-align:left; line-height:1.35;
}


/* Single-screen interview: chat + answers, no double page-scroll */
.history{max-height:none !important;overflow:visible !important}
.interview-card{
  display:flex; flex-direction:column;
  position:relative;
  max-height:none;
  padding:0 !important;
  overflow:hidden;
}
.interview-head{
  flex:0 0 auto;
  padding:12px 14px 10px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(18,28,48,.98), rgba(12,18,32,.96));
}
.interview-head .intro-snip{
  font-size:.8rem; color:var(--muted); margin:6px 0 0; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.interview-head.compact .intro-snip{display:none}
.chat-pane{
  flex:1 1 auto;
  min-height:80px;
  max-height:min(34vh, 300px);
  overflow-y:auto;
  overflow-x:hidden;
  padding:10px 14px 12px;
  scrollbar-width:thin;
  scrollbar-color:var(--teal) transparent;
  scroll-behavior:auto;
  background:rgba(0,0,0,.12);
}
.chat-end-anchor{height:2px;width:100%}
.composer{
  flex:0 0 auto;
  border-top:1px solid var(--line);
  background:linear-gradient(180deg, rgba(8,14,26,.98), rgba(10,16,30,.99));
  padding:10px 12px 12px;
  max-height:none;
  overflow-y:auto;
  scrollbar-width:thin;
  box-shadow:0 -8px 24px rgba(0,0,0,.35);
  z-index:5;
}
.composer-label{
  display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  margin-bottom:4px;
}
.composer-label h2{margin:0; font-size:.95rem}
.composer-label .left-count{
  font-size:.72rem; color:var(--gold-l); font-weight:700; white-space:nowrap;
}
.composer .choices{margin-top:6px; gap:6px}
.composer .choice, .composer .action{padding:10px 12px; font-size:.84rem}
.composer .feedback{margin-top:0; margin-bottom:8px}
.latest-hit{
  margin:8px 0 4px; padding:8px 10px; border-radius:10px; font-size:.78rem;
  background:rgba(26,184,166,.1); border:1px solid rgba(26,184,166,.28); color:var(--ink);
}
.choice-mini-hint{font-size:.68rem;color:var(--muted);margin:0 0 6px;line-height:1.3}
.play-compact .header{margin-bottom:6px}
.play-compact .meters{margin-bottom:8px}
@media(min-width:960px){
  /* Side panel already shows meters — free vertical space for chat */
  .play-compact .meters{display:none}
  .play-compact .file-board{transform:scale(.92);transform-origin:top center;margin-bottom:8px}
}
@media(max-width:959px){
  .chat-pane{max-height:min(26vh, 200px)}
  .composer{max-height:none}
  .play-compact .meter{padding:6px 8px}
  .play-compact .meter .mv{font-size:.95rem}
}


/* Landscape phones: too short to box the hand in — let the page scroll instead */
@media(max-height:600px){
  .chat-pane{max-height:110px;min-height:64px}
  .play-compact .meters{display:none}
  .play-compact .file-board{margin-bottom:6px}
  .play-compact .file-board .seal{min-height:52px;padding:6px 3px 5px}
  .interview-head .intro-snip{display:none}
  .ms-grid{display:none}
  .app{padding-bottom:24px}
}
/* Affordance for the rare case the hand still has to scroll */
.scroll-hint{
  position:absolute; left:0; right:0; bottom:0; z-index:6; pointer-events:none; display:none;
  padding:20px 12px 7px; text-align:center;
  font-size:.64rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--gold-l);
  background:linear-gradient(180deg, rgba(8,14,26,0), rgba(8,14,26,.9) 55%, rgba(8,14,26,.99));
  border-radius:0 0 var(--radius) var(--radius);
}
.interview-card.composer-more .scroll-hint{display:block}
.interview-card.composer-more .composer{border-bottom:1px solid rgba(212,160,23,.35)}

/* Trading cards, badges, streaks, bosses */
.streak-bar{
  display:flex; align-items:center; gap:8px; margin:6px 0 0;
  font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
}
.streak-pips{display:flex; gap:4px}
.streak-pip{
  width:12px; height:12px; border-radius:3px;
  background:rgba(139,155,176,.25); border:1px solid var(--line);
}
.streak-pip.on{background:var(--gold-l); border-color:var(--gold-l); box-shadow:0 0 8px rgba(240,193,75,.5)}
.streak-pip.fire{background:var(--good); border-color:var(--good); animation:pulseFace .8s ease infinite}
.streak-label{color:var(--gold-l)}
.streak-label.hot{color:var(--good)}
.badge-row{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0}
.badge-chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 10px; border-radius:999px; font-size:.72rem; font-weight:700;
  background:rgba(212,160,23,.12); border:1px solid rgba(212,160,23,.4); color:var(--gold-l);
}
.badge-chip.locked{opacity:.4; filter:grayscale(1); border-style:dashed}
.badge-chip .bicon{font-size:.9rem}
.card-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:10px;
}
.tcard{
  position:relative; border-radius:14px; padding:12px 10px 14px; text-align:center;
  border:1px solid var(--line); background:linear-gradient(160deg, rgba(20,32,56,.95), rgba(10,16,30,.98));
  box-shadow:var(--shadow); min-height:168px;
  transition: transform .15s ease, border-color .15s ease;
}
.tcard.owned{border-color:rgba(26,184,166,.45)}
.tcard.gold{border-color:rgba(212,160,23,.7); box-shadow:0 0 20px rgba(212,160,23,.2)}
.tcard.boss{border-color:rgba(239,107,107,.55); background:linear-gradient(160deg, rgba(50,18,24,.95), rgba(16,10,18,.98))}
.tcard.locked{opacity:.55; filter:saturate(.3)}
.tcard .tface{
  width:56px; height:56px; border-radius:50%; margin:0 auto 8px;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:1rem; color:#fff;
  border:2px solid rgba(255,255,255,.2);
}
.tcard .tclass{font-family:"Cormorant Garamond",serif; font-size:.95rem; font-weight:700; color:var(--ink); line-height:1.15}
.tcard .tname{font-size:.68rem; color:var(--muted); margin-top:3px}
.tcard .tmeta{font-size:.62rem; margin-top:8px; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); font-weight:700}
.tcard .tlock{font-size:.65rem; color:var(--muted); margin-top:8px; line-height:1.3}
.tcard .trarity{
  position:absolute; top:8px; right:8px; font-size:.58rem; font-weight:800;
  padding:2px 6px; border-radius:6px; background:rgba(0,0,0,.4); color:var(--gold-l);
}
.tcard.boss .trarity{color:#fecaca}
.boss-banner{
  margin:10px 0; padding:10px 12px; border-radius:12px;
  background:rgba(239,107,107,.1); border:1px solid rgba(239,107,107,.35);
  font-size:.82rem; color:var(--ink);
}
.boss-banner strong{color:#fecaca}
.prog-row{display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 4px; font-size:.78rem; color:var(--muted)}
.prog-row strong{color:var(--gold-l)}
.collect-tabs{display:flex; gap:8px; margin:8px 0}
.collect-tabs button{
  background:rgba(0,0,0,.25); border:1px solid var(--line); color:var(--muted);
  border-radius:999px; padding:6px 12px; font-size:.75rem; font-weight:700; cursor:pointer;
}
.collect-tabs button.on{border-color:var(--teal); color:var(--teal); background:rgba(26,184,166,.1)}


/* Performance */
.play-shell, .interview-card, .side-panel, .chat-pane, .composer{
  contain: layout style;
}
.chat-pane{ content-visibility: auto; }
.side-panel.desktop-only{ content-visibility: auto; contain-intrinsic-size: 400px; }
.dialogue, .choice, .action, .tracker-seal{ content-visibility: auto; }
.float-layer{ contain: strict; pointer-events: none; }
.choice:active, .action:active{ transform: scale(0.99); }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .face-wrap.trust-crisis{ animation: none !important; }
  .confetti{ display: none !important; }
}


/* --- Extra motion pack --- */
.badge{ animation: bounceIn .55s cubic-bezier(.2,1.3,.4,1) both; }
.score{ animation: scorePop .5s cubic-bezier(.2,1.2,.4,1) both; }
.card.result{ animation: fadeSlideUp .4s ease both; }

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeSlideInLeft {
  from { opacity: 0; transform: translateX(-14px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes fadeSlideInRight {
  from { opacity: 0; transform: translateX(14px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes popIn {
  0% { opacity: 0; transform: scale(0.86); }
  70% { transform: scale(1.04); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes softPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(26,184,166,.0); }
  50% { box-shadow: 0 0 0 6px rgba(26,184,166,.12); }
}
@keyframes meterGlow {
  0% { filter: brightness(1); }
  40% { filter: brightness(1.35); }
  100% { filter: brightness(1); }
}
@keyframes sealBurst {
  0% { transform: scale(1); }
  40% { transform: scale(1.12); box-shadow: 0 0 28px rgba(62,207,142,.45); }
  100% { transform: scale(1) translateY(-2px); }
}
@keyframes sealRing {
  0% { opacity: .9; transform: scale(0.6); }
  100% { opacity: 0; transform: scale(1.6); }
}
@keyframes shimmer {
  0% { background-position: -120% 0; }
  100% { background-position: 220% 0; }
}
@keyframes bounceIn {
  0% { opacity: 0; transform: scale(0.3); }
  50% { transform: scale(1.1); }
  70% { transform: scale(0.95); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes streakFire {
  0%, 100% { transform: scale(1); box-shadow: 0 0 6px rgba(240,193,75,.4); }
  50% { transform: scale(1.15); box-shadow: 0 0 14px rgba(62,207,142,.7); }
}
@keyframes faceMorph {
  0% { transform: scale(0.96); filter: brightness(0.9); }
  100% { transform: scale(1); filter: brightness(1); }
}
@keyframes cardDeal {
  from { opacity: 0; transform: translateY(20px) rotate(-2deg); }
  to { opacity: 1; transform: translateY(0) rotate(0); }
}
@keyframes bossPulse {
  0%, 100% { border-color: rgba(239,107,107,.45); }
  50% { border-color: rgba(239,107,107,.9); box-shadow: 0 0 22px rgba(239,107,107,.25); }
}
@keyframes choiceIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes feedbackIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, -12px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes scorePop {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes sparkle {
  0% { opacity: 0; transform: scale(0) rotate(0deg); }
  40% { opacity: 1; transform: scale(1) rotate(20deg); }
  100% { opacity: 0; transform: scale(0.4) rotate(40deg); }
}

.interview-card{ animation: fadeSlideUp .35s ease both; }
.play-shell .side-panel.desktop-only:first-child{ animation: fadeSlideInLeft .4s ease both; }
.play-shell .side-panel.desktop-only:last-child{ animation: fadeSlideInRight .4s ease both; }

.dialogue{
  animation: fadeSlideUp .28s ease both;
}
.dialogue.you{ animation-name: fadeSlideInRight; }
.dialogue:not(.you){ animation-name: fadeSlideInLeft; }

.latest-hit{ animation: popIn .35s cubic-bezier(.2,1.2,.4,1) both; }

.composer .choice,
.composer .action{
  animation: choiceIn .28s ease both;
  transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
}
.composer .choice:nth-child(1), .composer .action:nth-child(1){ animation-delay: .02s; }
.composer .choice:nth-child(2), .composer .action:nth-child(2){ animation-delay: .04s; }
.composer .choice:nth-child(3), .composer .action:nth-child(3){ animation-delay: .06s; }
.composer .choice:nth-child(4), .composer .action:nth-child(4){ animation-delay: .08s; }
.composer .choice:nth-child(5), .composer .action:nth-child(5){ animation-delay: .1s; }
.composer .choice:nth-child(6), .composer .action:nth-child(6){ animation-delay: .12s; }
.composer .choice:nth-child(n+7), .composer .action:nth-child(n+7){ animation-delay: .14s; }

.composer .choice:hover, .composer .action:hover{
  transform: translateY(-2px);
  border-color: rgba(26,184,166,.55);
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.composer .choice:active, .composer .action:active{
  transform: translateY(0) scale(0.98);
}

.feedback.show{ animation: feedbackIn .32s ease both; }

.seal{
  transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
}
.seal:hover{ transform: translateY(-3px); }
.seal.open{ animation: none; }
.seal.just-open{
  animation: sealBurst .55s cubic-bezier(.2,1.4,.4,1) both;
  z-index: 2;
}
.seal.just-open::after{
  content:"";
  position:absolute; inset:-4px; border-radius:14px;
  border:2px solid rgba(62,207,142,.7);
  animation: sealRing .7s ease-out both;
  pointer-events:none;
}
.seal.boss.open.just-open::after{ border-color: rgba(240,193,75,.8); }

.meter .fill, .lm-fill, .live-meter .lm-fill{
  transition: width .45s cubic-bezier(.2,.8,.2,1);
}
.meter.bump .fill, .live-meter.bump .lm-fill{
  animation: meterGlow .5s ease;
}

.face-wrap{
  transition: border-color .35s ease, box-shadow .35s ease, filter .35s ease, transform .35s ease;
}
.face-wrap.mood-change{ animation: faceMorph .4s ease; }
.face-svg path, .face-svg circle{
  transition: all .35s ease;
}

.streak-pip{
  transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
}
.streak-pip.on{
  animation: bounceIn .35s cubic-bezier(.2,1.3,.4,1) both;
}
.streak-pip.fire{ animation: streakFire .8s ease infinite; }

.face-mood{ transition: color .3s ease; }
.face-quote{ animation: fadeSlideUp .35s ease both; }

.tcard{
  animation: cardDeal .4s ease both;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.card-grid .tcard:nth-child(1){ animation-delay: .02s; }
.card-grid .tcard:nth-child(2){ animation-delay: .05s; }
.card-grid .tcard:nth-child(3){ animation-delay: .08s; }
.card-grid .tcard:nth-child(4){ animation-delay: .11s; }
.card-grid .tcard:nth-child(5){ animation-delay: .14s; }
.card-grid .tcard:nth-child(6){ animation-delay: .17s; }
.card-grid .tcard:nth-child(7){ animation-delay: .2s; }
.card-grid .tcard:nth-child(8){ animation-delay: .23s; }
.card-grid .tcard:nth-child(9){ animation-delay: .26s; }
.card-grid .tcard:nth-child(10){ animation-delay: .29s; }
.tcard:hover{ transform: translateY(-4px) scale(1.02); }
.tcard.gold{
  background-image: linear-gradient(120deg, transparent 30%, rgba(240,193,75,.12) 50%, transparent 70%);
  background-size: 200% 100%;
  animation: cardDeal .4s ease both, shimmer 2.8s linear infinite;
}

.diff-pill{ animation: popIn .3s ease both; }
.diff-pill.diff-hard, .diff-pill:is([class*="boss"]), span.diff-pill{
  /* boss uses diff-hard */
}
.interview-head .diff-pill{
  transition: transform .2s ease;
}
.client-row .diff-pill{
  animation: popIn .35s ease both;
}
/* Boss interview pulse */
.interview-card.is-boss{
  animation: fadeSlideUp .35s ease both, bossPulse 2.2s ease infinite;
}

.badge-win, .result .score, .sc-score-num{
  animation: scorePop .5s cubic-bezier(.2,1.2,.4,1) both;
}
.result .badge, .result-badge, .win-badge{
  animation: bounceIn .55s cubic-bezier(.2,1.3,.4,1) both;
}

/* generic result badge class used in markup - target score number */
.result-hero, .score-big, .big-score{
  animation: scorePop .55s cubic-bezier(.2,1.2,.4,1) both;
}

.chip{ animation: popIn .3s ease both; }
.narrative{ animation: fadeSlideUp .3s ease both; }
.crisis, .kitchen{ animation: popIn .4s cubic-bezier(.2,1.2,.4,1) both; }
.dice.roll{ animation: spin .5s linear infinite; }

.toast.show, .toast:not([hidden]){
  animation: toastIn .28s ease both;
}

/* Seal sparkle dots on just-open */
.seal.just-open .s-icon{ animation: softPulse .6s ease; position: relative; }
.seal.just-open .s-icon::before,
.seal.just-open .s-icon::after{
  content:"✦";
  position:absolute;
  font-size:.55rem;
  color: var(--gold-l);
  animation: sparkle .7s ease both;
  pointer-events:none;
}
.seal.just-open .s-icon::before{ top:-6px; right:-4px; animation-delay: .05s; }
.seal.just-open .s-icon::after{ bottom:-4px; left:-6px; animation-delay: .15s; color: var(--good); }

/* Progress pips on file board */
.file-board{ animation: fadeSlideUp .3s ease both; }
.mode-grid .mode{ animation: fadeSlideUp .35s ease both; transition: transform .15s ease, border-color .15s ease; }
.mode-grid .mode:nth-child(1){ animation-delay:.03s }
.mode-grid .mode:nth-child(2){ animation-delay:.06s }
.mode-grid .mode:nth-child(3){ animation-delay:.09s }
.mode-grid .mode:nth-child(4){ animation-delay:.12s }
.mode-grid .mode:hover{ transform: translateY(-2px); }
.mode-grid .mode.on{ box-shadow: 0 0 0 1px rgba(26,184,166,.5), 0 8px 20px rgba(26,184,166,.12); }


/* Button primary sheen */
.btn-p{
  position: relative;
  overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn-p:hover{ transform: translateY(-1px); box-shadow: 0 8px 22px rgba(26,184,166,.25); }
.btn-p::after{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
  background-size: 200% 100%;
  animation: shimmer 2.5s linear infinite;
  pointer-events:none;
}

@media (prefers-reduced-motion: reduce){
  .interview-card, .play-shell .side-panel, .dialogue, .latest-hit,
  .composer .choice, .composer .action, .feedback.show, .seal.just-open,
  .streak-pip.on, .streak-pip.fire, .tcard, .tcard.gold, .btn-p::after,
  .crisis, .kitchen, .chip, .narrative, .face-wrap.mood-change,
  .badge-win, .result .score, .sc-score-num, .interview-card.is-boss{
    animation: none !important;
  }
  .composer .choice:hover, .composer .action:hover, .seal:hover, .tcard:hover, .btn-p:hover{
    transform: none !important;
  }
  .seal.just-open::after, .seal.just-open .s-icon::before, .seal.just-open .s-icon::after{
    display: none !important;
  }
}


.dialogue .aside{ color:var(--muted); font-style:italic; font-size:.84em; }
.dialogue{ line-height:1.45; }
.dialogue.you{ opacity:.95; }

function hashStr(s){
  let h=0; for(let i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; }
  return Math.abs(h);
}
function questionText(q){
  const vars = Q_VARIANTS[q.id];
  if(!vars || !vars.length) return q.text;
  const seed = (state.runSeed||0) + hashStr(q.id + ":" + (state.client&&state.client.id||""));
  return vars[seed % vars.length];
}

function foundationCount(){
  return ["job","pain","shoes"].filter(s=>state.found[s]).length;
}

// The question a trained specialist actually reaches for, per seal.
const SEAL_CANONICAL = {
  job:["q_day"],
  pain:["q_pain","q_footwear_detail","q_activity"],
  shoes:["q_shoes","q_footwear_detail"],
  hotButton:["q_impact","q_goals","q_who","q_nobrainer","q_activity"],
  decision:["q_decide","q_who","q_nobrainer","q_tried"]
};
// The sequencing lesson: foundation before emotion, emotion before decision process.
function sealReady(key, tr){
  if(key==="job" || key==="pain" || key==="shoes") return true;
  if(key==="hotButton") return foundationCount()>=2 || (foundationCount()>=1 && tr.emotionalOpenness>=0.6);
  if(key==="decision") return countFound()>=3 && (state.found.hotButton || tr.spouseSensitivity<=0.55);
  return false;
}

function updateAdaptiveDifficulty(newlyFound){
  if(!state.adaptive) state.adaptive = { guard:0, pressure:0, easyStreak:0, hardStreak:0 };
  const ad = state.adaptive;
  const rate = countFound() / Math.max(1, state.turn);
  if(newlyFound.length>=2){ ad.easyStreak++; ad.hardStreak=0; }
  else if(newlyFound.length===0 && state.strengths[state.strengths.length-1]==="strong"){ ad.hardStreak++; ad.easyStreak=0; }
  else { ad.easyStreak=0; }

  if(rate >= 0.85 && state.turn>=2){ ad.guard = Math.min(0.55, ad.guard + 0.08); ad.pressure = Math.min(0.4, ad.pressure + 0.05); }
  if(newlyFound.length>=2){ ad.guard = Math.min(0.55, ad.guard + 0.06); }
  if(ad.hardStreak>=2){ ad.guard = Math.max(0, ad.guard - 0.07); }
  if(mode().id==="leader") ad.guard = Math.min(0.6, ad.guard + 0.03);
  if(mode().id==="rookie") ad.guard = Math.max(0, ad.guard * 0.7);
}

function finalizeReveals(q, proposed){
  const tr = clientTraits();
  const ad = (state.adaptive && state.adaptive.guard) || 0;
  const found = state.found;
  const out = [];
  const diff = state.client && state.client.difficulty;
  const isBoss = !!(state.client && (state.client.boss || diff==="boss"));

  for(const key of proposed){
    if(!SEALS.includes(key) || found[key]) continue;
    let chance = q.strength==="strong" ? 0.88 : (q.strength==="medium" ? 0.68 : 0.08);

    if(key==="pain" && !found.job) chance *= 0.72;
    if(key==="shoes" && !found.job && !found.pain) chance *= 0.75;
    if(key==="hotButton"){
      if(!found.job && !found.pain) chance *= 0.28;
      else if(foundationCount()<1) chance *= 0.45;
      else if(foundationCount()<2) chance *= 0.75;
      chance *= (0.65 + tr.emotionalOpenness*0.45);
    }
    if(key==="decision"){
      if(countFound()<2) chance *= 0.22;
      else if(countFound()<3) chance *= 0.55;
      if(!found.hotButton && tr.spouseSensitivity>0.55) chance *= 0.6;
      chance *= (0.75 - tr.spouseSensitivity*0.2 + tr.openness*0.15);
      if(state.priceHeat>=65) chance *= 0.55;
      if(state.trust<45) chance *= 0.5;
    }

    if(diff==="hard") chance *= 0.78;
    if(isBoss) chance *= 0.65;
    if(diff==="easy") chance *= 1.12;
    if(diff==="medium") chance *= 0.92;

    if(tr.loves && tr.loves.includes(q.id)) chance = Math.min(0.97, chance + 0.1);
    if(tr.hates && tr.hates.includes(q.id)) chance *= 0.38;

    if(state.trust < 35) chance *= 0.45;
    else if(state.trust < 50) chance *= 0.7;
    else if(state.trust >= 78) chance = Math.min(0.96, chance + 0.06);

    chance *= (1 - ad * 0.55);
    chance *= (0.82 + Math.random() * 0.36);

    if(state.turn >= state.maxTurns - 2 && countFound() < 4){
      if(tr.openness > 0.55) chance = Math.min(0.95, chance + 0.1);
      else chance *= 0.85;
    }

    // Skill floor: a canonical question asked at the right moment lands.
    // Everything above still shapes weak, off-book or mistimed asks — this only
    // guarantees that good judgment is not overruled by a chain of multipliers.
    if(q.strength!=="weak" && (SEAL_CANONICAL[key]||[]).indexOf(q.id)>=0 && sealReady(key, tr)){
      let floor = q.strength==="strong" ? 0.94 : 0.82;
      if(isBoss) floor -= 0.06;
      else if(diff==="hard") floor -= 0.03;
      if(tr.hates && tr.hates.includes(q.id)) floor -= 0.10;
      if(state.trust < 35) floor -= 0.05;
      floor -= ad * 0.10;
      // If this is the last canonical route to that seal, one unlucky roll
      // should not be what ends the file.
      const routesLeft = state.shuffled.filter(x=>state.asked.indexOf(x.id)<0 && (SEAL_CANONICAL[key]||[]).indexOf(x.id)>=0).length;
      if(routesLeft===0) floor = Math.max(floor, 0.97);
      chance = Math.max(chance, floor);
    }

    chance = Math.max(0.02, Math.min(0.97, chance));
    if(Math.random() < chance) out.push(key);
  }

  if(state.trust>=72 && out.length && countFound()>=2 && Math.random()<0.12 && !found.decision){
    if((q.id==="q_impact"||q.id==="q_goals"||q.id==="q_who") && !out.includes("decision")){
      if(Math.random()<0.5) out.push("decision");
    }
  }
  return out;
}

function drawQuestionHand(){
  const remaining = state.shuffled.filter(q=>!state.asked.includes(q.id));
  if(!remaining.length) return [];
  const m = mode();
  let handSize = m.id==="rookie" ? 5 : (m.id==="leader" ? 3 : 4);
  if(state.client && (state.client.boss || state.client.difficulty==="hard")) handSize = Math.max(3, handSize - 1);
  const ad = (state.adaptive && state.adaptive.guard) || 0;

  const strong = shuffle(remaining.filter(q=>q.strength==="strong"));
  const med = shuffle(remaining.filter(q=>q.strength==="medium"));
  const weak = shuffle(remaining.filter(q=>q.strength==="weak"));
  const hand = [];
  const used = new Set();

  const take = (arr, n) => {
    for(const q of arr){
      if(hand.length>=handSize) break;
      if(used.has(q.id)) continue;
      hand.push(q); used.add(q.id);
      n--; if(n<=0) break;
    }
  };

  if(state.turn===0){
    take(strong, 2); take(med, 1); take(weak, 1); take(shuffle(remaining), handSize);
  } else if(ad > 0.3){
    take(weak, 1); take(med, 2); take(strong, 1); take(shuffle(remaining), handSize);
  } else {
    take(strong, Math.min(2, strong.length));
    take(med, 1);
    if(weak.length && (state.turn>1 || Math.random()<0.7)) take(weak, 1);
    take(shuffle(remaining), handSize);
  }

  const out = shuffle(hand).slice(0, handSize);

  // A hand with no route to a closed seal is dice, not judgment. Keep at least
  // one live path to whichever closed seal has the fewest options left.
  const missing = SEALS.filter(s=>!state.found[s]);
  if(missing.length){
    let scarce=null, scarceOpts=null;
    for(const s of missing){
      const opts = remaining.filter(q=>q.reveals.indexOf(s)>=0);
      if(!opts.length) continue;
      if(!scarceOpts || opts.length < scarceOpts.length){ scarce=s; scarceOpts=opts; }
    }
    if(scarceOpts && !out.some(q=>q.reveals.indexOf(scarce)>=0)){
      let idx = out.findIndex(q=>q.strength==="weak");
      if(idx<0) idx = out.findIndex(q=>!q.reveals.some(r=>missing.indexOf(r)>=0));
      if(idx<0) idx = out.length-1;
      if(idx>=0) out[idx] = shuffle(scarceOpts)[0];
    }
  }
  return out;
}

function missNarrative(q, attempted){
  const lines = [
    "They answer, but carefully. Nothing new lands in the file.",
    "Polite words — thin on detail. The seal stays closed.",
    "You get surface. The real map is still underneath.",
    "They nod, then deflect. Not enough trust for that door yet.",
    "Interesting — but not enough to open a seal this pass."
  ];
  if(attempted.includes("decision")) return "Decision territory stays foggy. Pushing process too early often does that.";
  if(attempted.includes("hotButton")) return "Emotion stays behind glass. Foundation first usually unlocks it.";
  if(q.strength==="strong") return lines[Math.floor(Math.random()*lines.length)]+" Strong question — wrong moment or thin trust.";
  return lines[Math.floor(Math.random()*lines.length)];
}

// Audio
let audioCtx = null, soundOn = true;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function beep(freq, dur, type, vol){
  if(!soundOn) return;
  try{
    ensureAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq; g.gain.value = vol || 0.06;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(vol||0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (dur||0.15));
    o.start(t); o.stop(t + (dur||0.15));
  }catch(e){}
}
function sfx(k){
  if(!soundOn) return;
  if(k==="hit"){ beep(520,.08,"triangle",.05); setTimeout(()=>beep(780,.1,"triangle",.04),70); }
  else if(k==="crit"){ beep(440,.06,"square",.04); setTimeout(()=>beep(660,.08,"square",.05),60); setTimeout(()=>beep(880,.12,"triangle",.06),130); }
  else if(k==="miss"){ beep(180,.18,"sawtooth",.04); }
  else if(k==="crisis"){ beep(140,.25,"sawtooth",.06); setTimeout(()=>beep(110,.3,"square",.05),200); }
  else if(k==="save"){ beep(600,.1,"sine",.05); setTimeout(()=>beep(900,.15,"sine",.05),100); }
  else if(k==="fail"){ beep(200,.2,"triangle",.05); setTimeout(()=>beep(140,.25,"triangle",.05),150); }
  else if(k==="win"){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15,"triangle",.05), i*120)); }
  else if(k==="click"){ beep(700,.04,"sine",.03); }
  else if(k==="seal"){ beep(880,.08,"sine",.04); setTimeout(()=>beep(1175,.12,"sine",.04),80); }
  else if(k==="pattern"){ beep(400,.1,"triangle",.04); setTimeout(()=>beep(600,.12,"sine",.04),100); }
}

function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORAGE)||"{}"); }catch(e){ return {}; } }
function saveStore(d){ localStorage.setItem(STORAGE, JSON.stringify(d)); }
function profileKey(){ return (state.playerName||"Player").trim().toLowerCase()+"::"+(state.storeName||"Store").trim().toLowerCase(); }

function recordResult(result){
  const db=loadStore(); if(!db.players) db.players={};
  const key=profileKey();
  const p=db.players[key]||{ name:state.playerName||"Player", store:state.storeName||"Store", games:0, wins:0, bestScore:0, totalScore:0, decisionFinds:0, noEscape:0, recoveriesWon:0, missed:{job:0,pain:0,shoes:0,hotButton:0,decision:0}, achievements:[], badges:[], cards:{}, bestStrongStreak:0, stealLines:[] };
  if(!p.cards) p.cards={};
  if(!p.badges) p.badges=[];
  p.games+=1; p.totalScore+=result.score;
  if(result.score>p.bestScore) p.bestScore=result.score;
  if(result.foundCount===5 && result.owned) p.wins+=1;
  if(result.found.decision) p.decisionFinds+=1;
  if(result.owned) p.noEscape+=1;
  p.recoveriesWon=(p.recoveriesWon||0)+(result.recoveriesWon||0);
  if((result.maxStrongStreak||0) > (p.bestStrongStreak||0)) p.bestStrongStreak = result.maxStrongStreak;
  SEALS.forEach(seal=>{ if(!result.found[seal]) p.missed[seal]=(p.missed[seal]||0)+1; });
  const ach = new Set(p.achievements||[]);
  (result.newAchievements||[]).forEach(a=>ach.add(a));
  p.achievements=[...ach];
  // Badges
  const badges = new Set(p.badges||[]);
  (result.newBadges||[]).forEach(b=>badges.add(b));
  p.achievements.forEach(a=>badges.add(a));
  p.badges=[...badges];
  // Trading card for this client class
  if(state.client){
    const cid = state.client.id;
    const prev = p.cards[cid] || { id:cid, className:state.client.className, name:state.client.name, owned:false, gold:false, plays:0, wins:0 };
    prev.plays = (prev.plays||0)+1;
    prev.owned = true;
    prev.className = state.client.className;
    prev.name = state.client.name;
    prev.boss = !!state.client.boss;
    if(result.foundCount===5 && result.owned) prev.wins = (prev.wins||0)+1;
    if(result.perfect) prev.gold = true;
    if(result.foundCount===5 && result.owned) prev.gold = prev.gold || false; // gold only perfect
    if(result.perfect) prev.gold = true;
    p.cards[cid] = prev;
  }
  // Collection badges
  const ownedCards = Object.values(p.cards).filter(c=>c.owned);
  if(ownedCards.length>=5){ badges.add("card_collector"); ach.add("card_collector"); }
  const standardOwned = CLIENTS.filter(c=>p.cards[c.id] && p.cards[c.id].owned).length;
  if(standardOwned>=CLIENTS.length){ badges.add("full_binder"); ach.add("full_binder"); }
  p.badges=[...badges];
  p.achievements=[...ach];
  if(result.stealLines) p.stealLines = [...new Set([...(p.stealLines||[]), ...result.stealLines])].slice(-12);
  db.players[key]=p; db.last={ name:state.playerName, store:state.storeName, modeId:state.modeId, reflection:state.reflection };
  saveStore(db); return p;
}
function leaderboard(){ const list=Object.values(loadStore().players||{}); list.sort((a,b)=>b.bestScore-a.bestScore||b.wins-a.wins); return list.slice(0,8); }

function floatText(text, color){
  if(PERF.reducedMotion) return;
  const layer = document.getElementById("floatLayer");
  if(!layer) return;
  // Cap concurrent floats to avoid DOM buildup
  while(layer.childElementCount >= PERF.maxFloats){
    layer.removeChild(layer.firstChild);
  }
  const el = document.createElement("div");
  el.className = "float-txt";
  el.textContent = text;
  if(color) el.style.color = color;
  el.style.left = (40 + Math.random()*40) + "%";
  el.style.top = (30 + Math.random()*25) + "%";
  layer.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 1200);
}


function toast(title, sub){

}

function voice(){
  const id = state.client && state.client.id;
  return VOICE[id] || VOICE.sarah;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function chance(p){ return Math.random() < p; }

function memoryBits(){
  // What the Client can naturally reference from prior answers
  const bits = [];
  const h = state.history || [];
  const found = state.found || {};
  if(found.job) bits.push({ tag:"job", line: shortFact("job") });
  if(found.pain) bits.push({ tag:"pain", line: shortFact("pain") });
  if(found.shoes) bits.push({ tag:"shoes", line: shortFact("shoes") });
  if(found.hotButton) bits.push({ tag:"hot", line: shortFact("hotButton") });
  if(found.decision) bits.push({ tag:"dec", line: shortFact("decision") });
  if(h.length>=2) bits.push({ tag:"meta", line:null });
  return bits;
}
function shortFact(key){
  const f = facts(); if(!f) return "";
  const map = {
    job: f.job_guarded || f.job_full,
    pain: f.pain_guarded || f.pain_full,
    shoes: f.shoes_guarded || f.shoes_full,
    hotButton: f.hot_guarded || f.hot_full,
    decision: f.dec_guarded || f.dec_full
  };
  let s = (map[key]||"").replace(/\s+/g," ").trim();
  if(s.length>90) s = s.slice(0,87).replace(/\s+\S*$/,"")+"…";
  return s;
}

function referBack(){
  const bits = memoryBits().filter(b=>b.line);
  if(!bits.length || !chance(0.55)) return "";
  const b = pick(bits);
  const starters = [
    "Like I said about "+b.tag+" — wait, not like that — ",
    "Going back to what I mentioned — ",
    "Same thing I was saying earlier: ",
    "You know how I told you… ",
    "Connected to that — "
  ];
  // cleaner versions by tag
  if(b.tag==="job") return pick([
    "With my work schedule? ",
    "On those long days I described — ",
    "Given how much I'm on my feet — "
  ]);
  if(b.tag==="pain") return pick([
    "With that pain pattern — ",
    "When it flares like I said — ",
    "Because of where it hits me — "
  ]);
  if(b.tag==="shoes") return pick([
    "In the shoes I wear most — ",
    "With what I've got on my feet day-to-day — "
  ]);
  if(b.tag==="hot") return pick([
    "And that's why it matters at home — ",
    "Which ties into what I care about — "
  ]);
  if(b.tag==="dec") return pick([
    "And with how we decide things — ",
    "Because of who else is involved — "
  ]);
  return pick(starters);
}

function moodColor(){
  if(state.crisis || state.flags.crisisActive) return "crisis";
  if(state.priceHeat>=70) return "price";
  if(state.timePressure>=70) return "rushed";
  if(state.trust>=72) return "open";
  if(state.trust<38) return "closed";
  if(((state.adaptive&&state.adaptive.guard)||0) > 0.3) return "wary";
  return "neutral";
}

function wrapHuman(coreText, opts){
  opts = opts || {};
  const v = voice();
  const mood = moodColor();
  let t = (coreText||"").trim();
  if(!t) t = "I'm not sure how to put it.";

  // Strip overly clinical completeness sometimes — real people trail off
  if(chance(0.2) && t.length>80 && !opts.mustComplete){
    t = t.replace(/[.!?]+$/,"") + pick(["…"," — yeah.","."]);
  }

  const parts = [];

  // Opening beat (single — never stack)
  const hasStage = /^\([^)]+\)\s*/.test(t);
  if(hasStage){
    // keep stage direction on core; don't add verbal opener every time
    if(mood==="rushed" && chance(0.35)) parts.push(pick(["I'll keep this short. ","Quick — "]));
    else if(chance(0.35)) parts.push(pick(v.openers) + " ");
  } else if(opts.forceOpen || chance(0.65)){
    if(mood==="rushed") parts.push(pick(["I'll keep this short. ","Quick answer — ","I don't have long. "]));
    else if(mood==="closed") parts.push(pick(v.openers) + " " + pick(["I guess… ","Maybe… ",""]));
    else if(mood==="open") parts.push((chance(0.35)?pick(v.laugh):"") + pick(v.openers) + " ");
    else if(mood==="price") parts.push(pick(v.openers) + " ");
    else parts.push(pick(v.openers) + " ");
  }

  // Hedge / softener (clean spacing)
  if(mood==="open" && chance(0.4)) parts.push(pick(v.hedges).replace(/^./, c=>c.toUpperCase()) + " — ");
  else if(mood==="wary" && chance(0.45)) parts.push(pick(v.soft) + " ");
  else if(mood==="closed" && chance(0.35)) parts.push(pick(v.deflect) + " ");

  // Memory bridge
  if(!opts.noMemory && state.history && state.history.length){
    const rb = referBack();
    if(rb) parts.push(rb);
  }

  parts.push(t);

  // Natural add-on reactions (not new seals — human texture)
  if(opts.opened && opts.opened.length && mood==="open" && chance(0.35)){
    parts.push(" " + pick([
      "I don't usually say that out loud on a first visit.",
      "Feels weirdly good to put that into words.",
      "I hope that helps you help me."
    ]));
  }
  if(opts.missed && chance(0.45)){
    parts.push(" " + pick([
      "I don't know if that's useful.",
      "Sorry if that's vague.",
      "I'm not trying to be difficult.",
      "I might be holding something back."
    ]));
  } else if(opts.opened && opts.opened.length && mood==="open" && chance(0.25)){
    parts.push(" " + pick([
      "There — that's the real version.",
      "I don't usually put it that plainly."
    ]));
  }
  if(mood==="price" && chance(0.55)){
    parts.push(" " + pick(v.tense));
  }
  if(mood==="rushed" && chance(0.4)){
    parts.push(" " + pick([" Can we stay on the important parts?"," I need to wrap soon."]));
  }

  // Client asks something back — feels like real conversation
  let askBack = "";
  if(opts.allowAskBack !== false && state.turn>=1 && chance(0.28 + (mood==="open"?0.1:0))){
    askBack = " " + pick(v.askBack);
  }
  // Boss dual-decision: occasionally include the other person
  if(state.client && (state.client.id==="boss_spouse_phone" || state.client.id==="boss_daughter_chair" || state.client.id==="patricia") && chance(0.35)){
    askBack += " " + pick(v.askBack);
  }

  let out = parts.join("").replace(/\s+/g," ").replace(/\s+([,.!?])/g,"$1").trim();
  out = out.replace(/\s{2,}/g," ").replace(/\s+\./g,".").replace(/\?\./g,"?").replace(/\.\./g,".");
  if(askBack){
    out = out.replace(/[.!?]+$/,"") + ".";
    out += askBack.startsWith(" ") ? askBack : (" " + askBack);
  }

  // Personality length clamp for rushed
  if(v.pace==="rushed" && out.length>220 && chance(0.6)){
    out = out.slice(0, out.lastIndexOf(".", 180)+1) || out.slice(0,180)+"…";
  }
  return out;
}

function speakFact(full, guarded, depth){
  // depth: "full" | "partial" | "thin"
  if(depth==="full") return full;
  if(depth==="thin"){
    // First clause only / shortened
    const g = guarded || full;
    const cut = g.split(/[.;—]/)[0];
    return cut + (chance(0.5) ? "." : "…");
  }
  // partial: mix
  if(chance(0.5)) return guarded;
  // blend: start guarded, add a bit of full
  const extra = full.replace(guarded,"").trim();
  if(extra && chance(0.4)) return guarded.replace(/\.$/,"") + " — " + extra.split(/[.!?]/)[0] + ".";
  return guarded;
}

function humanReactionToQuestion(q){
  // Stage-direction beat only (wrapHuman owns verbal openers — avoids "Yeah — Yeah —")
  if(q.strength==="weak"){
    return pick(["(shrugs) ","(flat) ","",""]);
  }
  if(q.id==="q_money_early"){
    return pick(["(pause) ","(shifts in chair) ","(eyebrows up) ",""]);
  }
  if(q.id==="q_impact"||q.id==="q_goals"){
    return pick(["(thinks a second) ","(looks down) ",""]);
  }
  if(q.id==="q_who"||q.id==="q_decide"||q.id==="q_nobrainer"){
    return pick(["(careful) ","(glances aside) ",""]);
  }
  if(q.id==="q_pain"){
    return pick(["(points near foot) ","",""]);
  }
  return "";
}

function buildResponse(q){
  const f=facts(); const tr=clientTraits();
  let effTrust = state.trust;
  if(tr.loves && tr.loves.includes(q.id)) effTrust += 10;
  if(tr.hates && tr.hates.includes(q.id)) effTrust -= 16;
  if(q.reveals.includes("hotButton")) effTrust += (tr.emotionalOpenness-0.5)*16;
  if(q.reveals.includes("decision")) effTrust -= (tr.guardedness-0.4)*12 + ((state.adaptive&&state.adaptive.guard)||0)*20;
  if(q.strength==="weak") effTrust -= 10 + tr.guardedness*10;
  effTrust -= ((state.adaptive&&state.adaptive.guard)||0) * 18;
  const high = effTrust>=70; const low = effTrust<40;
  const mid = !high && !low;
  const already=state.found;
  let core="", proposed=q.reveals.slice(), narrative="";
  let depth = high ? (Math.random()>0.18?"full":"partial") : (mid ? (Math.random()>0.45?"partial":"thin") : "thin");
  // Client loves → slightly deeper; hates → thinner
  if(tr.loves && tr.loves.includes(q.id) && depth==="thin") depth="partial";
  if(tr.hates && tr.hates.includes(q.id) && depth==="full") depth="partial";

  // --- Weak / trap questions: human shut-downs ---
  if(q.id==="q_money_early"){
    let raw;
    if(state.priceHeat>=50 || already.decision){
      raw="If we're already on cost — just say the number. I hate the slow walk-up to a big price.";
      narrative="Arms fold. Price just became the dragon in the room.";
    } else if(low){
      raw="I'd rather not do budget before I even understand what you're recommending. That feels backwards.";
      narrative="They deflect. Trust is thin — money talk landed like a trap.";
    } else {
      raw="Can we park the money talk for a minute? I want to know if this is even the right kind of help first.";
      narrative="Polite — but walls go up a notch.";
    }
    return { text: wrapHuman(humanReactionToQuestion(q)+raw, { noMemory:true, allowAskBack:true }), canReveal:[], narrative };
  }
  if(q.id==="q_surface"){
    const raw = depth==="full"
      ? (state.client.id==="derek"
          ? "Years. It never fully leaves. Some mornings I feel it before I even hit the job."
          : "It's been a while — long enough that I stopped expecting it to just vanish. Good days, bad days, mostly bad by evening.")
      : "A while. It comes and goes. Hard to pin a start date.";
    narrative = low ? "Short answer. They're not opening the file." : "Polite timeline. No new seal opened.";
    return { text: wrapHuman(raw, { allowAskBack:chance(0.2) }), canReveal:[], narrative };
  }
  if(q.id==="q_doctor"){
    const raw = depth==="full"
      ? "I've mentioned it. Nobody ever made it feel like there was a real plan — more like 'live with it' energy."
      : "Not really focused on the doctor route right now.";
    narrative="Clinical history doesn't open the five seals.";
    return { text: wrapHuman(raw, { allowAskBack:false }), canReveal:[], narrative };
  }
  if(q.id==="q_scale"){
    const raw = depth==="full" ? "By the end of a hard day? Maybe a six or seven. Mornings are different." : "Depends on the day. Numbers feel weird for this.";
    narrative="A number without a story. The file stays incomplete.";
    return { text: wrapHuman(raw, { allowAskBack:false }), canReveal:[], narrative };
  }

  // --- Substantive questions ---
  if(q.id==="q_day"){
    core = speakFact(f.job_full, f.job_guarded, depth);
    narrative = depth==="full" ? "They map the day — Job may open." : "Partial day picture. Job not guaranteed.";
  } else if(q.id==="q_pain"){
    core = speakFact(f.pain_full, f.pain_guarded, depth);
    narrative = depth==="full" ? "Location and timing surface." : "Pain stays a bit vague.";
  } else if(q.id==="q_shoes"){
    core = speakFact(f.shoes_full, f.shoes_guarded, depth);
    narrative = depth==="full" ? "Everyday shoes come into focus." : "Footwear answer is thin.";
  } else if(q.id==="q_impact" || q.id==="q_goals"){
    if(low && !already.pain && !already.job){
      core = pick([
        "It's annoying. I manage. I don't need a whole emotional unpack today.",
        "I deal with it. That's about as deep as I can go right now.",
        "It's fine. Well — not fine. But I handle it."
      ]);
      proposed=[]; narrative="Low trust + no foundation. Hot Button stays sealed.";
    } else {
      core = q.id==="q_goals"
        ? speakFact(f.goals, f.hot_guarded, depth)
        : speakFact(f.hot_full, f.hot_guarded, depth);
      narrative = depth==="full" ? "Emotional cost is on the table." : "They keep the why close to the chest.";
    }
  } else if(q.id==="q_decide" || q.id==="q_who" || q.id==="q_nobrainer"){
    if(state.priceHeat>=70 && (low || Math.random()<0.35)){
      core = pick([
        "Honestly I'm stuck on cost. Everything else is background noise until I know what this runs.",
        "My brain already jumped to price. Hard to talk process when I'm bracing for a number."
      ]);
      proposed=[]; narrative="Price Heat hijacks the decision conversation.";
    } else if(low || (countFound()<2 && Math.random()<0.4)){
      if(q.id==="q_who"){
        core = chance(0.5) ? "Mostly just me… I think." : speakFact(f.who, f.dec_guarded, "thin");
      } else {
        core = speakFact(f.dec_guarded, f.dec_guarded, "thin");
      }
      narrative="Guarded on decision process — seal is not free.";
    } else {
      if(q.id==="q_who") core = speakFact(f.who, f.dec_guarded, depth);
      else if(q.id==="q_nobrainer") core = speakFact(f.nobrainer, f.dec_guarded, depth);
      else core = speakFact(f.dec_full, f.dec_guarded, depth);
      if(q.id==="q_who" || q.id==="q_nobrainer"){
        proposed = depth==="full" ? ["decision","hotButton"] : ["decision"];
        narrative = depth==="full" ? "Who/what-matters door opens a crack." : "Partial decision clarity only.";
      } else {
        proposed=["decision"]; narrative="Decision process is in play — not automatic.";
      }
      if(state.client.hasSpouse || (state.client.tags||[]).includes("dual")) state.flags.spouseHinted=true;
    }
  } else if(q.id==="q_tried"){
    core = speakFact(f.tried, f.tried, depth==="thin"?"thin":depth);
    proposed = ["decision"];
    narrative = "Past attempts are on the table — Decision-Maker still has to earn its seal.";
  } else if(q.id==="q_activity"){
    core = speakFact(f.activity, f.activity, depth);
    proposed = depth==="full" ? ["pain","hotButton"] : (already.pain ? ["hotButton"] : ["pain"]);
    narrative = depth==="full" ? "Activities expose cost and pain." : "Activity talk helps — incomplete.";
  } else if(q.id==="q_footwear_detail"){
    core = speakFact(f.footwear_end, f.footwear_end, depth);
    proposed = depth==="full" ? ["shoes","pain"] : ["shoes"];
    narrative = depth==="full" ? "End-of-day picture is rich." : "Shoes only this pass.";
  } else {
    core="I'm not sure how to answer that."; proposed=[]; narrative="The path goes quiet.";
  }

  // Dual-person texture for boss/spouse cases
  if(state.client && state.client.id==="boss_spouse_phone" && chance(0.4) && (q.id==="q_who"||q.id==="q_decide"||q.id==="q_nobrainer"||q.id==="q_money_early")){
    core += " " + pick([
      "(toward phone) Babe, jump in if I'm getting this wrong.",
      "He's been quiet — which usually means he's thinking about the money.",
      "I can feel him listening for the catch."
    ]);
  }
  if(state.client && (state.client.id==="boss_daughter_chair"||state.client.id==="patricia") && chance(0.35) && (q.reveals||[]).includes("decision")){
    core += " " + pick([
      "(glances at her daughter) I don't want to step on your toes.",
      "She'll tell me later if I agreed too fast.",
      "I'm watching her face more than I'm watching yours, if I'm honest."
    ]);
  }

  let canReveal = finalizeReveals(q, proposed);
  const missed = proposed.length>0 && canReveal.length===0;

  if(missed){
    narrative = missNarrative(q, proposed);
    if(chance(0.25) && depth!=="thin") narrative += " Close — but not enough for the file.";
  } else if(canReveal.length){
    if(canReveal.length < proposed.length) narrative += " Partial file update — not every door opened.";
    else if(depth==="full") narrative += " Seal opportunity converts.";
  }

  // Optional: Client adds a human fragment that is NOT a free seal
  if(!missed && canReveal.length && chance(0.2)){
    core += " " + pick([
      "I don't know if that's what you were looking for.",
      "Anyway — that's the honest version.",
      "I can go deeper if you need."
    ]);
  }

  const text = wrapHuman(humanReactionToQuestion(q) + core, {
    opened: canReveal,
    missed: missed,
    allowAskBack: q.strength!=="weak" || chance(0.15),
    mustComplete: canReveal.includes("decision") || canReveal.includes("hotButton")
  });

  return { text, canReveal, narrative };
}


function applyEffects(q, newlyFound){
  const m=mode();
  const tr=clientTraits();
  let trustDelta=0, timeDelta=0, priceDelta=0, xpGain=0;
  if(q.strength==="strong"){
    trustDelta = newlyFound.length>=2 ? 14 : (newlyFound.length===1 ? 10 : 4);
    timeDelta = -3; xpGain = newlyFound.length>=2 ? 40 : (newlyFound.length?25:8);
  } else if(q.strength==="medium"){
    trustDelta = newlyFound.length ? 6 : 1; timeDelta = 4; xpGain = newlyFound.length?15:5;
  } else {
    trustDelta = -8; timeDelta = 12; xpGain = 0;
    if(q.id==="q_money_early"){ trustDelta=-14; priceDelta=28; state.flags.earlyMoney=true; }
    else priceDelta=6;
  }
  // Client-specific modifiers
  if(tr.loves && tr.loves.includes(q.id)){ trustDelta += 5; timeDelta -= 2; xpGain += 5; }
  if(tr.hates && tr.hates.includes(q.id)){ trustDelta -= 8; timeDelta += 6; priceDelta += Math.round(8*tr.priceSensitivity); }
  if(q.id==="q_money_early"){ priceDelta = Math.round(priceDelta * (0.7 + tr.priceSensitivity)); trustDelta = Math.round(trustDelta * (0.8 + tr.priceSensitivity*0.5)); }
  if(q.strength==="weak"){ timeDelta = Math.round(timeDelta * (0.7 + tr.timeSensitivity*0.8)); trustDelta = Math.round(trustDelta * (0.85 + tr.guardedness*0.4)); }
  if(q.strength==="strong" && newlyFound.length){ trustDelta = Math.round(trustDelta * (0.85 + tr.openness*0.35)); }
  if(state.client && state.client.difficulty==="hard" && q.strength==="weak") trustDelta -= 2;
  if(state.client && (state.client.difficulty==="boss"||state.client.boss) && q.strength==="weak"){ trustDelta -= 5; timeDelta += 4; priceDelta += 4; }
  if(state.client && (state.client.difficulty==="boss"||state.client.boss) && q.strength==="strong" && newlyFound.length){ trustDelta += 1; }
  if(state.client && state.client.difficulty==="easy" && q.strength==="strong" && newlyFound.length) trustDelta += 2;
  if(q.strength==="weak" && state.turn>=Math.floor(state.maxTurns*0.5)){ timeDelta+=6; trustDelta-=4; }
  if(m.id==="leader"){ if(q.strength==="weak"){ trustDelta-=4; timeDelta+=4; } if(q.strength==="strong" && newlyFound.length) trustDelta+=2; }
  if(m.id==="rookie" && trustDelta<0) trustDelta=Math.floor(trustDelta*0.6);
  if(newlyFound.includes("decision") && state.flags.spouseHinted) trustDelta+=3;
  state.trust=clamp(state.trust+trustDelta,0,100);
  state.timePressure=clamp(state.timePressure+timeDelta,0,100);
  state.priceHeat=clamp(state.priceHeat+priceDelta,0,100);
  state.xp+=xpGain;
  return { trustDelta, timeDelta, priceDelta, xpGain };
}

function maybeCrisis(q){
  if(state.flags.crisisActive || state.flags.crisisResolved>=2) return null;
  const hit = q.id==="q_money_early" || state.weakStreak>=2 || state.timePressure>=75 || state.trust<=25 || ((state.adaptive&&state.adaptive.pressure||0)>0.25 && state.weakStreak>=1) || (Math.random()<0.08 && q.strength==="weak" && state.turn>=2);
  if(!hit) return null;
  if(q.id==="q_money_early" || state.priceHeat>=55)
    return { title:"Price Heat Spike", body:"The Client's tone shifts: \"Okay, but how much is this going to run me?\" Choose how you recover — a bad recovery makes this harder." };
  if(state.timePressure>=75)
    return { title:"Time Pressure Spike", body:"They pull out their phone. \"I only have a few more minutes.\" Save the interview with a better move." };
  if(state.weakStreak>=2 || ((state.adaptive&&state.adaptive.pressure||0)>0.25 && state.weakStreak>=1))
    return { title:"Client Shields Up", body:"Two surface questions in a row. Answers are getting shorter. Recover with a stronger move." };
  return { title:"Trust Fracture", body:"Rapport is low. The Client is polite but closed. One recovery choice — make it count." };
}

function hitLabel(strength, newlyFound){
  if(strength==="strong" && newlyFound.length>=2) return { cls:"critical", tag:"CRITICAL INSIGHT" };
  if(strength==="strong") return { cls:"solid", tag:"SOLID HIT" };
  if(strength==="medium") return { cls:"glance", tag:"GLANCING BLOW" };
  return { cls:"miss", tag:"CRITICAL MISS" };
}

function patternPrompt(){
  const missing = SEALS.filter(s => !state.found[s]);
  if(!missing.length) return null;
  const labels = missing.map(s => SEAL_LABELS[s]).join(", ");
  let tip = "Strong next moves: map their day, pin pain location/timing, ask who else is part of the decision.";
  if(missing.includes("decision")) tip = "The Decision-Maker seal is still closed. Ask how they decide — or who else cares about this.";
  else if(missing.includes("hotButton")) tip = "Hot Button is still sealed. Ask what this is costing them at home — or what they'd get back if it were gone.";
  else if(missing.includes("job")) tip = "Job is still sealed. Walk through a typical day on their feet.";
  return { missing: labels, tip, count: missing.length };
}

function kitchenObjection(){
  const c=state.client;
  const missing = SEALS.filter(s=>!state.found[s]);
  const v = voice();
  // Build a spoken objection from real gaps + personality
  if(missing.includes("decision") || c.hasSpouse || (c.tags||[]).includes("dual") || c.boss){
    const lines = [
      "I need to talk to "+(c.id==="boss_daughter_chair"||c.id==="patricia"?"my daughter":"my husband")+" before I do anything. They're not here to hear the full picture.",
      "At home they're going to ask what this costs and why it's different — and I don't have a clean answer yet.",
      "I'm not deciding solo. If I walk in without them bought in, this dies at the kitchen table."
    ];
    if(c.id==="boss_spouse_phone") return "He's still on the line… and he's already asking what the total is. I can feel the veto coming if we rush.";
    if(c.id==="boss_bought_online") return "I can already hear myself comparing this to what I paid online. If I can't explain the difference, I'm walking.";
    return pick(lines);
  }
  if(missing.includes("hotButton")){
    return pick([
      "I still don't know if this is for 'nice to have' or something that actually changes my days.",
      "If I can't say what I'd get back — energy, work, family — I'll talk myself out of it tonight."
    ]);
  }
  if(missing.length){
    return pick([
      "There are still blanks. If I leave with blanks, I'll fill them with fear and Google.",
      "I don't feel finished. And unfinished me does not buy."
    ]);
  }
  // full file — classic pushback
  return pick([
    "Okay… but what if I get home and second-guess the money?",
    "I believe you in this chair. Tonight I'm going to be alone with the price tag.",
    "Convince the version of me that gets scared after dinner — not just the one sitting here."
  ]);
}
